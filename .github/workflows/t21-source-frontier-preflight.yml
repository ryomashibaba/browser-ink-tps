name: T21 source frontier geometry and provenance preflight
on:
  push:
    branches: [dev/t21-f4e103w-qa-infra]
    paths:
      - 'src/app/B283OriginalSourceSteeringScreen.ts'
      - 'src/app/B285RegisteredFlatSourceGapAudit.ts'
      - 'src/app/B285RegisteredFlatSourceGapAudit.test.ts'
      - 'src/stage/undertow/UndertowSpillwayStageSourceIdentityAudit.ts'
      - 'src/stage/undertow/UndertowSpillwayStageSourceIdentityAudit.test.ts'
      - 'scripts/qa-offline/t21-b284-stage-identity-provenance.mjs'
      - 'scripts/qa-offline/t21-b284-stage-identity-provenance.test.mjs'
      - 'src/app/B283OriginalSourceSteeringScreen.test.ts'
      - '.github/workflows/t21-source-frontier-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-registered-footprint-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --no-package-lock
      - name: "B284 regression: stage identity is distinct from collision provenance"
        run: node --test scripts/qa-offline/t21-b284-stage-identity-provenance.test.mjs
      - name: B284 verify the three exact pinned upstream SceneInfo versions
        env:
          B284_PROVENANCE_OUTPUT: /tmp/t21-b284-provenance.json
        run: node scripts/qa-offline/t21-b284-stage-identity-provenance.mjs --verify-upstream
      - name: Test actual frozen original polygon against B127 history; no native claims
        run: |
          npx vitest run src/app/B285RegisteredFlatSourceGapAudit.test.ts src/stage/undertow/UndertowSpillwayStageSourceIdentityAudit.test.ts src/app/B283OriginalSourceSteeringScreen.test.ts src/app/W10B124OriginalRaisedSourceBoundary.test.ts src/app/W10B127OriginalCorridorNextForecast.test.ts
      - name: Typecheck and build the unchanged game runtime
        run: npm run build -- --base=/browser-ink-tps/
      - name: Keep small numeric source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t21-b284-identity-source-evidence
          path: /tmp/t21-b284-provenance.json
          if-no-files-found: ignore
          retention-days: 14
