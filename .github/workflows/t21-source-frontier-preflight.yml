name: T21 source frontier geometry and provenance preflight
on:
  push:
    branches: [dev/t21-f4e103w-qa-infra]
    paths:
      - 'src/app/B283OriginalSourceSteeringScreen.ts'
      - 'src/app/B283OriginalSourceSteeringScreen.test.ts'
      - '.github/workflows/t21-source-frontier-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-registered-footprint-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --no-package-lock
      - name: Test actual frozen original polygon against B127 history; no native claims
        run: |
          npx vitest run src/app/B283OriginalSourceSteeringScreen.test.ts src/app/W10B124OriginalRaisedSourceBoundary.test.ts src/app/W10B127OriginalCorridorNextForecast.test.ts
      - name: Typecheck and build the unchanged game runtime
        run: npm run build -- --base=/browser-ink-tps/
