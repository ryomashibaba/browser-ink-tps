name: T21 B266 offline source-optics/ink registration QA
on:
  push:
    branches: ["dev/t21-f4e103w-qa-infra"]
    paths:
      - "scripts/qa-offline/t21-b266-crossrun-native-ink-registration*.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b266-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: B266 source gate, native ray match and no-ART-promote tests
        run: node --test scripts/qa-offline/t21-b266-crossrun-native-ink-registration.test.mjs
