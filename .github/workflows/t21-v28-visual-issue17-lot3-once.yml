name: T21 V28 VISUAL lot 3 - aim actor glass evidence-only
on:
  push:
    branches:
      - research/t21-v28-visual-20261117
    paths:
      - '.github/workflows/t21-v28-visual-issue17-lot3-once.yml'

permissions:
  contents: read

jobs:
  visual-aim-actor-glass:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install existing project dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Test native SOURCE HUD, actor pigments and original glass proof
        run: npx vitest run src/app/B245SourcePresentation.test.ts src/app/B248SourceActorVisuals.test.ts src/app/B250SourceStageReadability.test.ts src/app/B286SourceCompactTeam.test.ts src/app/B480FocusedSourcePracticeCss.test.ts src/app/B475RealFrontlineReadyChallenge.test.ts src/app/B476OriginalFrontlineObjectiveLayout.test.ts src/app/B364RealSourceCrosshair.test.ts
      - name: TypeScript and production build
        run: npm run build -- --base=/browser-ink-tps/
