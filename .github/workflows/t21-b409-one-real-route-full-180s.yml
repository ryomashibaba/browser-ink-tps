name: T21 B413 real 180s original human firing ink spend squid OWN recharge and resumed firing
on:
  push:
    branches: [research/t21-b406-single-session-real-enemy-range-audit-20261103, research/t21-integrated-a1-c-patrol-four-mode-20261105]
    paths:
      - 'scripts/t21-w10b139-original-native-descent-rally.mjs'
      - 'scripts/t21-b313-*.mjs'
      - 'scripts/t21-b409-*.mjs'
      - 'scripts/t21-b410-*.mjs'
      - 'scripts/t21-b411-*.mjs'
      - 'scripts/t21-b412-*.mjs'
      - 'scripts/t21-b413-*.mjs'
      - 'scripts/t21-b414-*.mjs'
      - 'scripts/t21-b419-*.mjs'
      - 'scripts/t21-b430-*.mjs'
      - 'scripts/t21-b433-*.mjs'
      - 'src/app/UndertowF3PlayablePreviewApp.ts'
      - 'src/app/B193SourceCoopMode.ts'
      - 'src/app/B193SourceCoopMode.test.ts'
      - 'src/app/B415LiveInkLoop.ts'
      - 'src/app/B415LiveInkLoop.test.ts'
      - 'src/app/B417SourcePaintedCellView.ts'
      - 'src/app/B417SourcePaintedCellView.test.ts'
      - 'src/ai/CpuAgentSystem.ts'
      - 'src/ai/B420SourceMeleePursuitAuthority.ts'
      - 'src/ai/B420SourceMeleePursuitAuthority.test.ts'
      - 'src/app/UndertowF3SourceTraffic.ts'
      - 'src/app/B421RealEnemyStandoff.ts'
      - 'src/app/B421RealEnemyStandoff.test.ts'
      - '.github/workflows/t21-b409-one-real-route-full-180s.yml'
  workflow_dispatch:
concurrency:
  group: t21-b413-original-real-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  genuine-original-route-180s:
    runs-on: ubuntu-latest
    # B431 reached second native 60s remaining, then the old 55m job cap cancelled it.
    # Preserve all original SOURCE/physics/score gates; allow genuine second TIME_UP.
    timeout-minutes: ${{ contains(github.event.head_commit.message, '[a3-visual-smoke]') && 30 || 80 }}
    env:
      # This is a genuine native first-source A1 CLEAR optical check, not a
      # re-run of the previously certified full B413 180s ink cycle.
      T21_A3_REAL_CLEAR_VISUAL: ${{ github.ref_name == 'research/t21-integrated-a1-c-patrol-four-mode-20261105' && contains(github.event.head_commit.message, '[a3-visual-smoke]') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact SOURCE runtime
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Independent physical route and game preflight
        run: |
          node --check scripts/t21-w10b139-original-native-descent-rally.mjs
          node --check scripts/t21-b409-original-route-full-native-game-audit.mjs
          node --check scripts/t21-b410-upper-original-activity-audit.mjs
          node --check scripts/t21-b411-native-active-round-hud-audit.mjs
          node --check scripts/t21-b411-native-hud-live-driver.mjs
          node --check scripts/t21-b412-native-original-squid-ink-swim.mjs
          node --check scripts/t21-b412-independent-real-squid-review.mjs
          node --check scripts/t21-b413-native-source-fire-refill-reshoot.mjs
          node --check scripts/t21-b413-independent-ink-economy-review.mjs
          node --check scripts/t21-b414-native-ink-hud-audit.mjs
          node --check scripts/t21-b419-real-full-round-fresh-replay.mjs
          node --check scripts/t21-b430-full-second-source-round.mjs
          node --check scripts/t21-b433-native-opponent-poll-audit.mjs
          node --test scripts/t21-b313-actual-original-cell-aim.test.mjs scripts/t21-b433-native-opponent-poll-audit.test.mjs scripts/t21-b430-full-second-source-round.test.mjs scripts/t21-b419-real-full-round-fresh-replay.test.mjs scripts/t21-b414-native-ink-hud-audit.test.mjs scripts/t21-b413-native-source-fire-refill-reshoot.test.mjs scripts/t21-b412-native-original-squid-ink-swim.test.mjs scripts/t21-b411-native-active-round-hud-audit.test.mjs scripts/t21-b410-upper-original-activity-audit.test.mjs scripts/t21-b409-original-route-full-native-game-audit.test.mjs scripts/t21-b316-native-human-ramp-walk.test.mjs scripts/t21-b327-original-lower-post-clear-shot.test.mjs scripts/t21-b328-genuine-a1-native-approach.test.mjs scripts/t21-b322-original-ramp-crest.test.mjs scripts/t21-b324-original-upper-floor-continuation.test.mjs scripts/t21-b326-extended-original-upper-floor.test.mjs
          npx vitest run src/app/B193SourceCoopMode.test.ts src/app/B415LiveInkLoop.test.ts src/app/B417SourcePaintedCellView.test.ts src/ai/B420SourceMeleePursuitAuthority.test.ts src/app/B421RealEnemyStandoff.test.ts
          npm run build -- --base=/browser-ink-tps/
      - name: One real native high-to-lower-to-ramp-to-upper 180s with 7 CPUs
        env:
          T21_B139_VARIANT: ALLY_RALLY
          T21_B162_REAL_ALLY_SYNC: '1'
          T21_B194_REAL_PLAYER_BUTTON: '1'
          T21_B200_REAL_REPLAY: '0'
          T21_B201_REAL_PAUSE_RESUME: '0'
          T21_B202_REAL_CONTROLS: '0'
          T21_B203_REAL_FULL_ROUND: '1'
          T21_B312_SECOND_HUMAN_SURFACE: '1'
          T21_B316_GENUINE_RAMP_WALK: '1'
          T21_B318_INTERIOR_RAMP_WALK: '1'
          T21_B320_TRUE_SOURCE_RAMP_UPHILL: '1'
          T21_B321_TRUE_UPPER_RAMP_KCC: '1'
          T21_B322_TRUE_CREST_EXIT: '1'
          T21_B324_REAL_UPPER_FLOOR_CONTINUATION: '1'
          T21_B326_EXTENDED_UPPER_FLOOR: '1'
          T21_B409_ONE_ROUTE_180S: '1'
          T21_B410_LATE_UPPER_HUMAN: '1'
          T21_B411_COMPACT_SOURCE_HUD: '1'
          T21_B412_REAL_ORIGINAL_SQUID_SWIM: '1'
          T21_B413_REAL_SOURCE_INK_LOOP: '1'
          # Existing historical B413 branch keeps two rounds. Integrated
          # Sprint A1 checks one real SOURCE ownerGrid spend/refill/reshot.
          T21_B419_REAL_REPLAY_SECOND_GAME: ${{ github.ref_name == 'research/t21-integrated-a1-c-patrol-four-mode-20261105' && '0' || '1' }}
          T21_B430_REAL_SECOND_FULL_180S: ${{ github.ref_name == 'research/t21-integrated-a1-c-patrol-four-mode-20261105' && '0' || '1' }}
          T21_F3_SHOT_DIR: /tmp/t21-b409-original-180s
        run: node scripts/t21-w10b139-original-native-descent-rally.mjs
      - name: Independently verify genuine A1 CLEAR native PLAYER-F8 layout and three actual PNG frames
        if: ${{ env.T21_A3_REAL_CLEAR_VISUAL == '1' }}
        run: |
          node --input-type=module <<'A3'
          import {readFileSync,statSync} from 'node:fs';
          const dir='/tmp/t21-b409-original-180s/';
          const d=JSON.parse(readFileSync(dir+'a3-real-a1-clear-player-f8.json','utf8'));
          const good=x=>x&&x.original==='25/17/26/0'&&
           x.phase==='PLAYING'&&x.realA1Clear==='true'&&
           x.compact==='true'&&x.cpu===7&&x.relocated===0&&
           x.pointerLocked===true;
          if(d.schema!=='T21_A3_GENUINE_SOURCE_A1_CLEAR_PLAYER_F8_V1'||
           d.verdict!=='PASS_REAL_A1_CLEAR_PLAYER_COMPACT_F8_QA_RESTORED'||
           d.source!=='25/17/26/0'||d.originalScoreable!==0||
           d.winner!=='NONE'||!good(d.first)||!good(d.qa)||!good(d.restored)||
           d.first.view!=='PLAYER'||d.qa.view!=='QA'||
           d.restored.view!=='PLAYER'||d.first.next.display!=='none'||
           d.first.time.display!=='none'||d.qa.next.visible!==true||
           d.qa.time.visible!==true||d.restored.next.display!=='none'||
           d.restored.time.display!=='none'||d.first.nativeInk.visible!==true||
           d.qa.nativeInk.visible!==true||d.restored.ownerCells.visible!==true||
           d.nativeActorWrites!==0||d.inkWrites!==0||
           d.scoreWrites!==0||d.clockWrites!==0||d.full180ReplayedThisRun!==false||
           d.formal4v4Certified!==false||
           d.screenshots?.length!==3)
           throw Error('A3_TRUE_NATIVE_PLAYER_F8_CSS_OR_SOURCE_PROVENANCE_HOLD');
          for(const file of d.screenshots){
           const f=readFileSync(dir+file);
           if(statSync(dir+file).size<10000||
            f.readUInt32BE(16)!==1600||f.readUInt32BE(20)!==900)
            throw Error('A3_REAL_CHROMIUM_IMAGE_INVALID_'+file);
          }
          console.log('A3_INDEPENDENT_REAL_NATIVE_F8_PLAYER_IMAGES_PASS');
          A3
      - name: Independently verify true original ink KCC and same native 180s
        if: ${{ env.T21_A3_REAL_CLEAR_VISUAL != '1' }}
        run: |
          node scripts/t21-b315-verify-native-three-surface-ink.mjs /tmp/t21-b409-original-180s/b312-real-original-lower-second-ink.json
          node scripts/t21-b322-original-ramp-crest.mjs /tmp/t21-b409-original-180s/b322-actual-original-ramp-crest.json
          node scripts/t21-b324-original-upper-floor-continuation.mjs /tmp/t21-b409-original-180s/b322-actual-original-ramp-crest.json /tmp/t21-b409-original-180s/b324-real-original-upper-floor.json
          node scripts/t21-b326-extended-original-upper-floor.mjs /tmp/t21-b409-original-180s/b322-actual-original-ramp-crest.json /tmp/t21-b409-original-180s/b324-real-original-upper-floor.json /tmp/t21-b409-original-180s/b326-extended-original-upper-floor.json
          node scripts/t21-b409-original-route-full-native-game-audit.mjs /tmp/t21-b409-original-180s
          node scripts/t21-b410-upper-original-activity-audit.mjs /tmp/t21-b409-original-180s
          node scripts/t21-b411-native-active-round-hud-audit.mjs /tmp/t21-b409-original-180s
          node scripts/t21-b412-independent-real-squid-review.mjs /tmp/t21-b409-original-180s
          node scripts/t21-b413-independent-ink-economy-review.mjs /tmp/t21-b409-original-180s
          node scripts/t21-b414-native-ink-hud-audit.mjs /tmp/t21-b409-original-180s
          node scripts/t21-b433-native-opponent-poll-audit.mjs /tmp/t21-b409-original-180s/b433-real-source-opponent-polls.json
      - name: Preserve historical two-match independent replay audits only on historical branch
        if: ${{ github.ref_name != 'research/t21-integrated-a1-c-patrol-four-mode-20261105' && env.T21_A3_REAL_CLEAR_VISUAL != '1' }}
        run: |
          node scripts/t21-b419-real-full-round-fresh-replay.mjs /tmp/t21-b409-original-180s/b419-real-second-source-round.json
          node scripts/t21-b430-full-second-source-round.mjs /tmp/t21-b409-original-180s/b430-two-authentic-source-180s.json
      - name: Preserve all genuine source route/ink/CPU/full-match evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b413-real-source-ink-consumption-own-refill-and-reshoot-full-180s
          path: /tmp/t21-b409-original-180s/
          retention-days: 14
          if-no-files-found: warn
