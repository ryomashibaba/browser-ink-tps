name: T21 V28 QA18 Lot4 source gameplay blocker real runner static gate
on:
  push:
    branches:
      - research/t21-v28-qa-route-cpu-cause-lot4-20261117
    paths:
      - .github/workflows/t21-v28-qa18-lot4-offline.yml
permissions:
  contents: read
  actions: read
jobs:
  independent-realplay-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 80
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Keep original SOURCE and only QA-owned changes
        env:
          SOURCE_SHA: e442edb5796a9633d25a72c661fc84bf5e34d7ce
        run: |
          git cat-file -e "$SOURCE_SHA^{commit}"
          git diff --name-only "$SOURCE_SHA" HEAD | while IFS= read -r file; do
            case "$file" in
              scripts/t21-b440-short-native-original-foot.mjs|scripts/t21-v28-qa-native-playability-blockers.mjs|scripts/t21-v28-qa-native-playability-blockers.test.mjs|docs/qa/T21_V28_ISSUE18_LOT4_GOAL_DENIAL_20261117_JA.md|.github/workflows/t21-v28-qa18-lot4-offline.yml) ;;
              *) echo "HOLD_UNAUTHORIZED_FILE: $file"; exit 1;;
            esac
          done
      - name: Check actual B440 native Chromium runner syntax (no test browser)
        run: |
          node --check scripts/t21-b440-short-native-original-foot.mjs
          node --check scripts/t21-v28-qa-native-playability-blockers.mjs
      - name: Run independent actual-source goal denial and prior B484 B367 QA regressions
        run: |
          node --test scripts/t21-v28-qa-native-playability-blockers.test.mjs scripts/t21-v28-qa-b484-hud-gate.test.mjs scripts/t21-v28-qa-real-hp-witness.test.mjs scripts/t21-v28-qa-real-b2b4-diff.test.mjs
      - name: Read archived *genuine* original RAW without new Chromium
        uses: actions/download-artifact@v4
        with:
          name: t21-v28-qa18-post-cpu-b484-original-once
          repository: ryomashibaba/browser-ink-tps
          run-id: 44035240101
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/t21-v28-qa18-archived-source
      - name: Verify B2/B4 actual Rapier rejection and F4 0/16 from archived RAW
        run: |
          DIR=/tmp/t21-v28-qa18-archived-source
          node scripts/t21-v28-qa-native-playability-blockers.mjs \
            "$DIR/b440-short-real-original-human-foot.json" \
            "$DIR/b454-native-b2-b4-physical-60hz.json" \
            "$DIR/qa-issue18-lot4-replayed-gameplay-blockers.json"
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import {readFileSync} from "node:fs";
            const a=JSON.parse(readFileSync("/tmp/t21-v28-qa18-archived-source/qa-issue18-lot4-replayed-gameplay-blockers.json"));
            assert.equal(a.actualCrossTeamNativePathPairs,0);
            assert.equal(a.genuineHumanCpuHpHits,0);
            assert.equal(a.result,"HOLD_REAL_NATIVE_4V4_AND_HP_CHAIN");
            for(const id of ["B2","B4"]){
             const x=a.byActor[id];
             assert.equal(x.observedGate,"HOLD_STRICT_ORIGINAL_GOALS_ALL_DENIED");
             assert.equal(x.nativeGoalAdmission.runtimeNoOriginalGoal,44);
             assert.equal(x.nativeGoalAdmission.actualNativeSourceGoalRequests,0);
             assert.equal(x.trueOriginalFootDryRoute.firstDeniedCauses.NATIVE_PATH_RAPIER_HEIGHT_MISMATCH,30);
             assert.equal(x.nativeFoot.allRegisteredOriginalFloorSupported,true);
            }
            console.log("QA18_GENUINE_ARCHIVED_RAW_CAUSAL_GATE_PASS_NO_NEW_BROWSER");
          '
