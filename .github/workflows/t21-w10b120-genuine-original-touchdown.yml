name: T21 W10-B120 genuine first-drop touchdown and original boundary
on:
  push:
    branches: [dev/t21-f4e103w-qa-infra]
    paths:
      - 'src/app/W10B120OriginalSourceBoundary.ts'
      - 'src/app/W10B120OriginalSourceBoundary.test.ts'
      - 'src/app/UndertowF3PlayablePreviewApp.ts'
      - 'src/app/B183OriginalHumanDescent.ts'
      - 'src/app/B183OriginalHumanDescent.test.ts'
      - 'src/app/B186RealOriginalSourceCircuit.ts'
      - 'src/app/B186RealOriginalSourceCircuit.test.ts'
      - 'scripts/t21-w10b187-real-native-source-circuit.mjs'
      - 'scripts/t21-w10b189-real-cpu-release-gate.mjs'
      - 'scripts/t21-w10b189-real-cpu-release-gate.test.mjs'
      - 'scripts/t21-w10b190-native-start-evidence.mjs'
      - 'scripts/t21-w10b190-native-start-evidence.test.mjs'
      - 'scripts/t21-w10b112-genuine-human-floor-walk.mjs'
      - '.github/workflows/t21-w10b120-genuine-original-touchdown.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-first-drop-source-touchdown:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --no-package-lock
      - name: Exact original source boundary and physical KCC tests
        run: |
          node --check scripts/t21-w10b112-genuine-human-floor-walk.mjs
          node --check scripts/t21-w10b187-real-native-source-circuit.mjs
          node --check scripts/t21-w10b189-real-cpu-release-gate.mjs
          node --test scripts/t21-w10b189-real-cpu-release-gate.test.mjs
          node --check scripts/t21-w10b190-native-start-evidence.mjs
          node --test scripts/t21-w10b190-native-start-evidence.test.mjs
          npx vitest run src/app/B183OriginalHumanDescent.test.ts src/app/B186RealOriginalSourceCircuit.test.ts src/app/W10B120OriginalSourceBoundary.test.ts src/app/W10B112HumanGroundLedger.test.ts src/app/W10B114OriginalFootprintAudit.test.ts src/stage/undertow/UndertowPhase14QFirstDropPassiveProxyGate.test.ts
          npm run build -- --base=/browser-ink-tps/
      # B187 supersedes the narrow B120 proof with ONE genuine physical
      # session: real first drop + original ramp + raised floor + human ink.
      # The old B120 runner remains untouched for independent dispatch
      # and historic exact-SHA baseline; no second long Chrome job.
      - name: Genuine Chrome one-session original first drop, ramp and human ink
        env:
          T21_B187_EVIDENCE_DIR: /tmp/t21-w10b120-original-touchdown
        run: node scripts/t21-w10b187-real-native-source-circuit.mjs
      - name: Preserve actual original physical descent, ramp, ink, and HUD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w10b120-original-registered-source-first-drop-touchdown
          path: /tmp/t21-w10b120-original-touchdown/
          if-no-files-found: warn
          retention-days: 14
