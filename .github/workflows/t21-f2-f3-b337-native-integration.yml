name: T21 F2+F3+B337 ISOLATED three native source mechanisms
on:
  push:
    branches:
      - research/t21-f2-f3-b337-native-integration-20261103
    paths:
      - 'scripts/t21-w10b139-original-native-descent-rally.mjs'
      - 'scripts/t21-b316-native-human-ramp-walk.test.mjs'
      - '.github/workflows/t21-f2-f3-b337-native-integration.yml'
      - 'src/app/B337ActualLocalActiveCell.ts'
      - 'src/app/B337ActualLocalActiveCell.test.ts'
      - 'src/app/UndertowF3PlayablePreviewApp.ts'
      - 'scripts/t21-b337-real-input-ink-round.mjs'
      - 'scripts/t21-b337-real-input-ink-audit.mjs'
      - 'scripts/t21-b337-real-input-ink-audit.test.mjs'
      - 'src/ai/CpuAgentSystem.ts'
      - 'src/ai/CpuAgentSystem.F3LethalLifecycle.test.ts'
      - 'src/app/UndertowF3SourceTraffic.ts'
      - 'src/app/UndertowF3SourceTraffic.LiveRejoin.test.ts'
      - 'src/app/B367RealCpuCombatTimeline.ts'
      - 'src/app/B367RealCpuCombatTimeline.test.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t21-f2-f3-b337-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-original-ramp:
    name: "Same frozen original source build: F3 HP lifecycle plus F2 ramp plus B337 real shot"
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --no-package-lock
      - name: Genuine F3 source CPU lethal, lifecycle, B367 and original sight regressions
        run: |
          npm exec -- vitest run \
            src/ai/CpuAgentSystem.F3LethalLifecycle.test.ts \
            src/app/B367RealCpuCombatTimeline.test.ts \
            src/app/UndertowF3SourceTraffic.LiveRejoin.test.ts \
            src/ai/B213NativeCounterfire.test.ts \
            src/ai/B181OriginalSourceCombatSight.test.ts
      - name: B337 strict real original PaintSurface and true native mouse proof regression
        run: |
          node --test \
            scripts/t21-b313-actual-original-cell-aim.test.mjs \
            scripts/t21-b337-real-input-ink-audit.test.mjs
          npm exec -- vitest run src/app/B337ActualLocalActiveCell.test.ts
          node --check scripts/t21-b337-real-input-ink-round.mjs
      - name: Exact original authored quad and fail-closed physical auditor
        run: |
          node --test \
            scripts/t21-b316-native-human-ramp-walk.test.mjs \
            scripts/t21-b318-original-ramp-interior.test.mjs \
            scripts/t21-b313-actual-original-cell-aim.test.mjs \
            scripts/t21-b315-verify-native-three-surface-ink.test.mjs
          node --check scripts/t21-w10b139-original-native-descent-rally.mjs
          npm run build -- --base=/browser-ink-tps/
      - name: Real combined F3-source CPU engine with human original 4-tick KeyW ramp KCC
        env:
          T21_B139_VARIANT: ALLY_RALLY
          T21_B162_REAL_ALLY_SYNC: '1'
          T21_B194_REAL_PLAYER_BUTTON: '1'
          T21_B200_REAL_REPLAY: '0'
          T21_B201_REAL_PAUSE_RESUME: '0'
          T21_B202_REAL_CONTROLS: '0'
          T21_B203_REAL_FULL_ROUND: '1'
          T21_B312_SECOND_HUMAN_SURFACE: '1'
          T21_B316_GENUINE_RAMP_WALK: '1'
          T21_B318_INTERIOR_RAMP_WALK: '0'
          T21_F3_SHOT_DIR: /tmp/t21-f2-f3-integrated
        run: node scripts/t21-w10b139-original-native-descent-rally.mjs
      - name: Independent original 3-surface ink witness
        run: node scripts/t21-b315-verify-native-three-surface-ink.mjs /tmp/t21-f2-f3-integrated/b312-real-original-lower-second-ink.json
      - name: CI green insufficient; require actual native B316 ramp + source-only 7 CPU
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const e=JSON.parse(readFileSync("/tmp/t21-f2-f3-integrated/b316-genuine-original-human-ramp-walk.json","utf8"));
            const real=e?.verdict==="GENUINE_ORIGINAL_RAMP_HUMAN_WALK_PASS"&&
              e.reachedOriginalRampOnGenuineCharacterKcc===true&&
              e.physicalKccStartVerified===true&&
              e.b316OriginalAuthoredQuadInteriorGuideUsed===true&&
              e.b318OriginalRampInteriorGuideOptIn===false&&
              e.b316RealInputPulseTicks===4&&
              e.first?.sourceActorRelocations===0&&
              e.first?.realHumanOriginalFootSupported===true&&
              e.original4v4Certified===false&&
              e.productionAuthorized===false&&
              Array.isArray(e.steps)&&e.steps.length>0&&
              e.steps.some(x=>
                x.after?.genuineHumanOriginalFootSolid===
                 "UndertowT21D:right-low-route-ramp-positive-z"&&
                x.after?.realHumanOriginalFootSupported===true&&
                x.after?.originalRows?.some(r=>
                  r.surfaceId==="UndertowT21D:right-low-route-ramp-positive-z:paint"&&
                  r.actualHumanFootOnOriginalActiveSurface===true));
            console.log("F2_STANDALONE_ORIGINAL_RAMP_TRUE_NATIVE_VERDICT",JSON.stringify({
              actualVerdict:e?.verdict,realSteps:e?.steps?.length??0,
              originalQuadInteriorGuide:e?.b316OriginalAuthoredQuadInteriorGuideUsed,
              independentRampPass:real,official4v4Certified:false
            }));
            if(!real)process.exitCode=1;
          '
      - name: Separate TRUE Chromium session human mouse, projectile and original ownerGrid ink
        env:
          T21_B337_OUTPUT: /tmp/t21-integration-b337
        run: node scripts/t21-b337-real-input-ink-round.mjs
      - name: Independent real SOURCE shot/paint/foot/Png evidence (not just green runner)
        run: node scripts/t21-b337-real-input-ink-audit.mjs /tmp/t21-integration-b337
      - name: Require two independent original-source Chrome gameplay witnesses
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const f=JSON.parse(readFileSync("/tmp/t21-f2-f3-integrated/b316-genuine-original-human-ramp-walk.json","utf8"));
            const b=JSON.parse(readFileSync("/tmp/t21-integration-b337/b337-independent-verdict.json","utf8"));
            const native=f.verdict==="GENUINE_ORIGINAL_RAMP_HUMAN_WALK_PASS" &&
              f.source==="25/17/26/0" &&
              f.reachedOriginalRampOnGenuineCharacterKcc===true &&
              f.original4v4Certified===false &&
              f.productionAuthorized===false &&
              b.verdict==="PASS_SAMPLED_NATIVE_INPUT_MOUSE_AIM_HUMAN_INK_ORIGINAL_FOOT" &&
              b.actualHumanNewShots>0 &&
              b.actualHumanChangedCells>0 &&
              b.actualSourceAimSurface==="UndertowT21D:spawn-high-positive-z:paint" &&
              b.gameplayCertified===false &&
              b.unrestricted4v4Certified===false &&
              b.productionAuthorized===false;
            console.log("T21_F2_F3_B337_SCOPED_SEPARATE_NATIVE_SESSIONS",JSON.stringify({
              originalHumanRampKcc:f.verdict,actualHumanShots:b.actualHumanNewShots,
              realOriginalInkCells:b.actualHumanChangedCells,
              scope:"TWO_GENUINE_NATIVE_SESSIONS_SAME_BUILD",
              actualHumanCpuCombatCertified:false,
              naturalEnemyRouteCertified:false,full4v4Certified:false,
              verdict:native?"SCOPED_SOURCE_INTEGRATION_PASS":"HOLD_UNPROVEN"
            }));
            if(!native)process.exitCode=1;
          '
      - name: Preserve real Chromium input, source floor ledger and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f2-f3-b337-isolated-native-original-two-session-evidence
          path: |
            /tmp/t21-f2-f3-integrated/
            /tmp/t21-integration-b337/
          retention-days: 14
          if-no-files-found: warn
