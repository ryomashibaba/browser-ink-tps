name: T21 F3 RESEARCH immediate native CPU splat offline contract
on:
  push:
    branches:
      - research/t21-f3-native-lethal-cpu-lifecycle-20261103
    paths:
      - 'src/ai/CpuAgentSystem.ts'
      - 'src/ai/CpuAgentSystem.F3LethalLifecycle.test.ts'
      - 'src/app/B367RealCpuCombatTimeline.ts'
      - 'src/app/B367RealCpuCombatTimeline.test.ts'
      - 'src/app/UndertowF3SourceTraffic.ts'
      - 'src/app/UndertowF3SourceTraffic.LiveRejoin.test.ts'
      - '.github/workflows/t21-f3-research-native-lethal-cpu-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t21-f3-source-lethal-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-native-hp-lifecycle:
    name: Typecheck + F3 real method regression (NOT native gameplay PASS)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --no-package-lock
      - name: Verify real F3 immediate HP-zero, shield, AoE and frozen T20
        run: |
          npm exec -- vitest run \
            src/ai/CpuAgentSystem.F3LethalLifecycle.test.ts \
            src/app/B367RealCpuCombatTimeline.test.ts \
            src/app/UndertowF3SourceTraffic.LiveRejoin.test.ts \
            src/ai/B213NativeCounterfire.test.ts \
            src/ai/B181OriginalSourceCombatSight.test.ts
      - name: Typecheck entire app and preserve frozen source stage contracts
        if: always()
        run: npm run typecheck
