name: T21 B139 original 7CPU + genuine human descent A1 rendezvous
on:
  push:
    branches: [dev/t21-f4e103w-qa-infra]
    paths:
      - 'scripts/t21-w10b139-original-native-descent-rally.mjs'
      - 'scripts/t21-w10b139-original-native-descent-rally.test.mjs'
      - 'scripts/t21-w10b140-real-physics-sample.mjs'
      - 'scripts/t21-w10b140-real-physics-sample.test.mjs'
      - 'scripts/t21-w10b147-native-teammate-approach-audit.mjs'
      - 'scripts/t21-w10b147-native-teammate-approach-audit.test.mjs'
      - 'scripts/t21-w10b148-original-A1-station-audit.mjs'
      - 'scripts/t21-w10b148-original-A1-station-audit.test.mjs'
      - 'scripts/t21-w10b149-native-A1-KCC-contact-audit.mjs'
      - 'scripts/t21-w10b149-native-A1-KCC-contact-audit.test.mjs'
      - 'scripts/t21-w10b153-real-A1-support-ink-audit.mjs'
      - 'scripts/t21-w10b153-real-A1-support-ink-audit.test.mjs'
      - 'scripts/t21-w10b154-seven-cpu-source-coverage-audit.mjs'
      - 'scripts/t21-w10b154-seven-cpu-source-coverage-audit.test.mjs'
      - 'src/app/UndertowF3OriginalAllySupportInk.ts'
      - 'src/app/UndertowF3OriginalAllySupportInk.test.ts'
      - 'src/app/W10B154OriginalTeamInkMode.ts'
      - 'src/app/W10B154OriginalTeamInkMode.test.ts'
      - 'src/app/W10B155OriginalSourceConnectivityReview.ts'
      - 'src/app/W10B155OriginalSourceConnectivityReview.test.ts'
      - '.github/workflows/t21-w10b139-original-native-descent-rally.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b139-original-real-rally-${{ github.ref }}
  # Preserve the existing genuine B152 Chrome run and its independent
  # B147-B149 evidence, even when a later QA batch is pushed.
  cancel-in-progress: false
jobs:
  genuine-descent-ally:
    name: Native original human walk and A1 physics (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [FIXED_DEFAULT, ALLY_RALLY, TEAM_COVERAGE]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm run build -- --base=/browser-ink-tps/
      - run: node --test scripts/t21-w10b139-original-native-descent-rally.test.mjs scripts/t21-w10b140-real-physics-sample.test.mjs scripts/t21-w10b147-native-teammate-approach-audit.test.mjs scripts/t21-w10b153-real-A1-support-ink-audit.test.mjs scripts/t21-w10b154-seven-cpu-source-coverage-audit.test.mjs
      - run: node --check scripts/t21-w10b139-original-native-descent-rally.mjs
      - name: Real shared Rapier PlayerController KCC-to-CPU collider identity regression
        run: npx vitest run src/stage/undertow/UndertowPhase14QSharedActorCollision.test.ts
      - name: Real PlayCanvas Rapier KCC W200 D12 W18 after genuine CPU 7/7
        env:
          T21_B139_VARIANT: ${{ matrix.variant }}
          T21_F3_SHOT_DIR: /tmp/t21-b139-source
        run: node scripts/t21-w10b139-original-native-descent-rally.mjs
      - name: Retain read-only original physical input evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b139-original-${{ matrix.variant }}
          path: /tmp/t21-b139-source/
          retention-days: 14
          if-no-files-found: warn

  b147-physical-ally-proof:
    name: B147 true A1 physical approach proof from BOTH original Chrome artifacts
    needs: [genuine-descent-ally]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run strict real native proof chain regressions
        run: node --test scripts/t21-w10b147-native-teammate-approach-audit.test.mjs scripts/t21-w10b148-original-A1-station-audit.test.mjs scripts/t21-w10b149-native-A1-KCC-contact-audit.test.mjs scripts/t21-w10b153-real-A1-support-ink-audit.test.mjs scripts/t21-w10b154-seven-cpu-source-coverage-audit.test.mjs
      - name: Retrieve independently recorded real opt-in human/A1 feet
        uses: actions/download-artifact@v4
        with:
          name: b139-original-ALLY_RALLY
          path: /tmp/t21-b147/ally
      - name: Retrieve real unchanged FIXED default feet
        uses: actions/download-artifact@v4
        with:
          name: b139-original-FIXED_DEFAULT
          path: /tmp/t21-b147/fixed
      - name: Retrieve real combined seven-CPU ink and A1 ally actions
        uses: actions/download-artifact@v4
        with:
          name: b139-original-TEAM_COVERAGE
          path: /tmp/t21-b147/team
      - name: Certify only actual source-backed physically convergent A1 behavior
        run: |
          mkdir -p /tmp/t21-b147/result
          node scripts/t21-w10b147-native-teammate-approach-audit.mjs \
            /tmp/t21-b147/ally/w10b139-ally_rally.json \
            /tmp/t21-b147/fixed/w10b139-fixed_default.json \
            /tmp/t21-b147/result/b147-real-native-physical-ally-proof.json
      - name: Prove B148 sustained physically stable original-source teammate station
        run: |
          node scripts/t21-w10b148-original-A1-station-audit.mjs \
            /tmp/t21-b147/ally/w10b139-ally_rally.json \
            /tmp/t21-b147/fixed/w10b139-fixed_default.json \
            /tmp/t21-b147/result/b147-real-native-physical-ally-proof.json \
            /tmp/t21-b147/result/b148-real-native-source-A1-station.json
      - name: B149 exact actual 60Hz HUMAN KCC versus A1 Rapier collider identity
        run: |
          node scripts/t21-w10b149-native-A1-KCC-contact-audit.mjs \
            /tmp/t21-b147/ally/w10b139-ally_rally.json \
            /tmp/t21-b147/fixed/w10b139-fixed_default.json \
            /tmp/t21-b147/result/b147-real-native-physical-ally-proof.json \
            /tmp/t21-b147/result/b148-real-native-source-A1-station.json \
            /tmp/t21-b147/result/b149-real-Rapier-KCC-A1-contact.json
      - name: Independently audit B152/B153 actual source-ink provenance
        run: |
          node scripts/t21-w10b153-real-A1-support-ink-audit.mjs \
            /tmp/t21-b147/ally/w10b139-ally_rally.json \
            /tmp/t21-b147/fixed/w10b139-fixed_default.json \
            /tmp/t21-b147/result/b153-native-A1-support-ink-proof.json
      - name: Compare three actual source-only 7CPU ink variants
        run: |
          node scripts/t21-w10b154-seven-cpu-source-coverage-audit.mjs \
            /tmp/t21-b147/fixed/w10b139-fixed_default.json \
            /tmp/t21-b147/ally/w10b139-ally_rally.json \
            /tmp/t21-b147/team/w10b139-team_coverage.json \
            /tmp/t21-b147/result/b154-seven-cpu-source-coverage.json
      - name: Retain independent measured physical rally verdict, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b147-real-native-ally-physical-proof
          path: /tmp/t21-b147/result/
          retention-days: 14
          if-no-files-found: warn
