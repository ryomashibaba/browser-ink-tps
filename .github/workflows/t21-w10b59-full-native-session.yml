name: T21 W10-B59 full 180-second native source session
on:
  push:
    branches: [dev/t21-f4e103w-qa-infra]
    paths:
      - 'src/app/UndertowF3SourceSessionBoard.ts'
      - 'src/app/UndertowF3PlayablePreviewApp.ts'
      - 'scripts/t21-f3-browser-smoke.mjs'
      - '.github/workflows/t21-w10b59-full-native-session.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-full-session:
    name: Real full native 180s F3 plus uns cored end and reload
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm run build -- --base=/browser-ink-tps/
      - run: npx vitest run src/app/UndertowF3SourceSessionBoard.test.ts src/app/UndertowF3PlayableHud.test.ts
      - run: node --check scripts/t21-f3-browser-smoke.mjs
      - name: 180 real 60Hz seconds with native input and source seven CPUs
        env:
          T21_W10B59_FULL_NATIVE_SESSION: '1'
          T21_F3_SHOT_DIR: /tmp/t21-w10b59
        run: node scripts/t21-f3-browser-smoke.mjs
      - name: Keep screenshot and 20-second authentic progress history even when failing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w10b59-full-180s-source-native-play-evidence
          path: /tmp/t21-w10b59/
          if-no-files-found: warn
          retention-days: 14