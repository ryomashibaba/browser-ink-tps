name: T21 B174 active 180s human + 7 CPU explicit original source ink SWEEP trial
on:
  push:
    branches: [dev/t21-f4e103w-qa-infra]
    paths:
      - 'src/app/UndertowF3SourceSessionBoard.ts'
      - 'scripts/t21-f3-browser-smoke.mjs'
      - 'scripts/t21-w10b174-active-source-sweep-gate.mjs'
      - 'scripts/t21-w10b174-active-source-sweep-gate.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-full-session:
    name: Real full native 180s original-source session, end and restart
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm run build -- --base=/browser-ink-tps/
      - run: npx vitest run src/app/UndertowF3SourceSessionBoard.test.ts src/app/UndertowF3PlayableHud.test.ts
      - run: node --check scripts/t21-f3-browser-smoke.mjs
      - run: node --test scripts/t21-w10b174-active-source-sweep-gate.test.mjs
      - name: B175 180 native seconds + true sustained CPU source ink and user
        env:
          T21_W10B59_FULL_NATIVE_SESSION: '1'
          T21_B172_ACTIVE_180S: '1'
          T21_B174_EXPLICIT_SOURCE_SWEEP_180S: '1'
          T21_F3_SHOT_DIR: /tmp/t21-w10b59
        run: node scripts/t21-f3-browser-smoke.mjs
      - name: Keep actual native source progress and end screenshot, even if failing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w10b59-full-180s-source-native-play-evidence
          path: /tmp/t21-w10b59/
          if-no-files-found: warn
          retention-days: 14