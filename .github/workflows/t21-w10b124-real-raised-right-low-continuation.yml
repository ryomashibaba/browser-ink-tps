name: T21 W10-B124 real raised original right-low continuation
on:
  push:
    branches: [dev/t21-f4e103w-qa-infra]
    paths:
      - 'src/app/W10B124OriginalRaisedSourceBoundary.ts'
      - 'src/app/W10B124OriginalRaisedSourceBoundary.test.ts'
      - 'src/app/UndertowF3PlayablePreviewApp.ts'
      - 'scripts/t21-w10b112-genuine-human-floor-walk.mjs'
      - '.github/workflows/t21-w10b124-real-raised-right-low-continuation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-original-raised-floor-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --no-package-lock
      - name: Exact original polygon witness, native source KCC, and build
        run: |
          node --check scripts/t21-w10b112-genuine-human-floor-walk.mjs
          npx vitest run src/app/W10B124OriginalRaisedSourceBoundary.test.ts src/app/W10B123OriginalUphillRampSourceAudit.test.ts src/app/W10B120OriginalSourceBoundary.test.ts src/app/W10B112HumanGroundLedger.test.ts src/app/W10B114OriginalFootprintAudit.test.ts
          npm run build -- --base=/browser-ink-tps/
      - name: Real 368 native key requests W200-D12-W18-D90-W24-W24 after ramp
        env:
          T21_B116_FORWARD_NATIVE_TICKS: '368'
          T21_B124_RAISED_ORIGINAL_CONTINUE: source
          T21_B112_EVIDENCE_DIR: /tmp/t21-w10b124-raised-original-native
        run: node scripts/t21-w10b112-genuine-human-floor-walk.mjs
      - name: Archive real KCC and original raised polygon on true native HOLD or PASS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w10b124-actual-original-raised-right-low-continuation
          path: /tmp/t21-w10b124-raised-original-native/
          if-no-files-found: warn
          retention-days: 14
