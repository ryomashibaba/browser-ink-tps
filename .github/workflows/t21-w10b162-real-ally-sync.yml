name: T21 W10-B162 real original A1 cooperative practice
on:
  push:
    branches: [dev/t21-f4e103w-qa-infra, research/t21-integrated-a1-c-patrol-four-mode-20261105]
    paths:
      - 'scripts/t21-w10b139-original-native-descent-rally.mjs'
      - 'scripts/t21-b330-replay-armed-resume-guard.mjs'
      - 'scripts/t21-b330-replay-armed-resume-guard.test.mjs'
      - 'src/app/UndertowF3SourcePaintRun.ts'
      - 'src/app/UndertowF3PracticeObjectiveView.ts'
      - 'src/app/B209OriginalRampEdge.ts'
      - 'src/app/B209OriginalRampEdge.test.ts'
      - 'src/app/B161OriginalAllySyncPractice.test.ts'
      - 'src/app/B165OriginalAllyPracticeProgress.ts'
      - 'src/app/B165OriginalAllyPracticeProgress.test.ts'
      - 'src/app/B166OriginalAllyRendezvous.test.ts'
      - 'src/app/B169OriginalAllyAdvanceGuard.ts'
      - 'src/app/B169OriginalAllyAdvanceGuard.test.ts'
      - 'src/app/UndertowF3SourceTraffic.ts'
      - 'src/app/B199ActualAllyCollisionRelief.ts'
      - 'src/app/B199ActualAllyCollisionRelief.test.ts'
      - 'src/app/B193SourceCoopMode.ts'
      - 'src/app/B193SourceCoopMode.test.ts'
      - 'src/app/B195NativeCoopMissionView.ts'
      - 'src/app/B195NativeCoopMissionView.test.ts'
      - 'src/app/B197CoopReplayDecision.ts'
      - 'src/app/B197CoopReplayDecision.test.ts'
      - 'src/app/B166OriginalAllyRendezvous.ts'
      - 'src/app/B166OriginalAllyRendezvous.test.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-original-ally-sync:
    name: True CDP human plus A1 source physical cooperative clear
    # Already genuine PASS on prior HEAD. Run one B448-only short A3
    # research case without redundantly repeating the unrelated A1
    # cooperative 5-minute browser run; manual dispatch still allowed.
    if: ${{ !contains(github.event.head_commit.message, '[a3-native-once]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm run build -- --base=/browser-ink-tps/
      - name: Prevent forged ally ink and protect previous source run behavior
        run: npx vitest run src/app/B441OriginalSourceFrontline.test.ts src/app/SourcePlayPortal.test.ts src/app/B161OriginalAllySyncPractice.test.ts src/app/B193SourceCoopMode.test.ts src/app/B195NativeCoopMissionView.test.ts src/app/B209OriginalRampEdge.test.ts src/app/B169OriginalAllyAdvanceGuard.test.ts src/app/B199ActualAllyCollisionRelief.test.ts src/app/B197CoopReplayDecision.test.ts src/app/B165OriginalAllyPracticeProgress.test.ts src/app/UndertowF3SourcePaintRun.test.ts src/app/UndertowF3PracticeObjectiveView.test.ts src/app/B160SourceCpuActivityView.test.ts
      - run: node --check scripts/t21-w10b139-original-native-descent-rally.mjs
      - run: node --test scripts/t21-w10b139-original-native-descent-rally.test.mjs scripts/t21-b330-replay-armed-resume-guard.test.mjs
      - name: Real player A1 co-op button then 60Hz authentic native challenge
        env:
          T21_B139_VARIANT: ALLY_RALLY
          T21_B162_REAL_ALLY_SYNC: '1'
          T21_B194_REAL_PLAYER_BUTTON: '1'
          # R-key CDP delivery was 0 DOM events on this research branch.
          # Keep genuine C/A1/7-CPU/60Hz; do not rerun same failed B200.
          # The formal B200 workflow on other branches is untouched.
          T21_B200_REAL_REPLAY: '0'
          T21_B201_REAL_PAUSE_RESUME: '0'
          T21_B202_REAL_CONTROLS: '0'
          T21_B203_REAL_FULL_ROUND: '1'
          # The isolated research branch preserves genuine A1/C-key and
          # original SOURCE gates; the transport-blocked R-key is on HOLD.
          # B201/B202 early pause gates remain separately held.
          T21_B162_READY_PREARM: '1'
          T21_B471_REAL_PLAYER_ORDER: '1'
          T21_F3_SHOT_DIR: /tmp/t21-w10b162
        run: node scripts/t21-w10b139-original-native-descent-rally.mjs
      - name: Preserve real A1 and human attempted trial whether CLEAR or HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w10b162-actual-original-human-A1-ally-sync
          path: /tmp/t21-w10b162/
          retention-days: 14
          if-no-files-found: warn
