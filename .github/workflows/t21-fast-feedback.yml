name: T21 fast feedback - full unit and type checks

on:
  # One bounded validation of the existing integrated research HEAD.
  # The narrow workflow-file path avoids running a full suite for every
  # subsequent gameplay commit; it remains manually dispatchable.
  push:
    branches: [research/t21-integrated-a1-c-patrol-four-mode-20261105]
    paths: [.github/workflows/t21-fast-feedback.yml]
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t21-fast-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  t21-fast:
    if: github.event_name != 'pull_request' || github.head_ref == 'codex/t21-undertow-evidence-ledger'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies (repository has no npm lockfile)
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Validate real physical HUMAN shared-collision and F3/F4 regression
        if: github.event_name == 'push'
        run: |
          npx vitest run \
            src/stage/undertow/UndertowPhase14QRealCpuGroundGate.test.ts \
            src/app/UndertowF3NativeHumanCrowd.W3.test.ts \
            src/core/InkBrushGpuPacking.test.ts \
            src/ai/CpuAgentSystem.F3LethalLifecycle.test.ts \
            src/app/UndertowF3SourceTraffic.LiveRejoin.test.ts \
            src/app/UndertowF3SourceTraffic.test.ts \
            src/app/UndertowF3PaintAwarePatrol.test.ts \
            src/app/B371RealSourceMissionCue.test.ts \
            src/app/UndertowF3OriginalAllyProximity.test.ts \
            src/app/UndertowF3SourceSessionBoard.test.ts \
            src/app/B367RealCpuCombatTimeline.test.ts
      - name: Entire unit test suite
        if: github.event_name != 'push'
        run: npm test
      - name: Screenshot scripts syntax preflight
        run: |
          node --check scripts/t21-review-five-view-capture.mjs
          node --check scripts/t21-phase13a-real-five-view-visual-baseline.mjs
          node --check scripts/t21-phase13b-ui-free-pair-qa.mjs
          node --check scripts/t21-phase13c-camera-qa.mjs
          node --check scripts/t21-phase13d-source-lens-qa.mjs
      - name: Phase13A and B negative-path selftests
        run: |
          node scripts/t21-phase13a-real-five-view-visual-baseline.mjs --self-test
          node scripts/t21-phase13b-ui-free-pair-qa.mjs --self-test
          node scripts/t21-phase13c-camera-qa.mjs --self-test
          node scripts/t21-phase13d-source-lens-qa.mjs --self-test
