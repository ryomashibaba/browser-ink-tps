name: T21 V28 ROUND lot3 one-off lightweight verification
on:
  push:
    branches: [research/t21-v28-round-lot3-20261117]
    paths: [.github/workflows/t21-v28-round-lot3-verify.yml]
permissions:
  contents: read
jobs:
  targeted-round:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm run typecheck
      - name: Source lifecycle, replay, human life and session board regression
        run: npx vitest run src/app/B389NativeSourceRoundReplay.test.ts src/app/B463SourceReplayMemory.test.ts src/app/B207SourceCombatRound.test.ts src/app/NativeSourceRoundActionWindow.test.ts src/app/B473RealSourceCombatLifeReadout.test.ts src/app/SourcePlayPortal.test.ts src/app/UndertowF3SourceSessionBoard.test.ts
      - name: Browser build only, no real Chromium or deploy
        run: npm run build -- --base=/browser-ink-tps/
