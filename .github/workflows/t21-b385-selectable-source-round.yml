name: T21 B385-B390 selected-kit original 180s SOURCE circuit
on:
  push:
    branches: [dev/t21-f4e103w-qa-infra, research/t21-integrated-a1-c-patrol-four-mode-20261105]
    paths:
      - 'scripts/t21-b385-native-selectable-circuit.mjs'
      - 'scripts/t21-b390-real-source-timeup.mjs'
      - 'src/app/UndertowF3PlayablePreviewApp.ts'
      - 'src/app/UndertowF3OwnerAimComparisonUI.ts'
      - 'src/app/B245SourcePresentation.test.ts'
      # Original-source CPU life, F2 re-entry and physical HP changes
      # must re-run the SAME genuine native 180s world, not unit QA alone.
      - 'src/app/UndertowF3SourceTraffic.ts'
      - 'src/app/B367RealCpuCombatTimeline.ts'
      - 'src/app/B367RealCpuCombatTimeline.test.ts'
      - 'src/projectile/ProjectileSystem.ts'
      - 'src/app/B400RealOriginalSourceGridRecap.ts'
      - 'src/app/B401NativeLiveSourceInkOwnership.ts'
      - 'src/app/B401NativeLiveSourceInkOwnership.test.ts'
      - '.github/workflows/t21-b385-selectable-source-round.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t21-b385-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-b384-user-round:
    # V15 P1 on the research branch: one real 180s milestone only.
    # Do not re-run this expensive workflow on subsequent game commits.
    if: github.ref != 'refs/heads/research/t21-integrated-a1-c-patrol-four-mode-20261105' || github.event_name == 'workflow_dispatch' || (contains(github.event.head_commit.message, '[p1-180s-once]') || contains(github.event.head_commit.message, '[b415-short]'))
    runs-on: ubuntu-latest
    timeout-minutes: ${{ contains(github.event.head_commit.message, '[b415-short]') && 20 || 75 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm run build -- --base=/browser-ink-tps/
      - name: Validate existing B384 source gates and HUD without test duplication
        run: npx vitest run src/app/UndertowF3PlayableHud.test.ts src/app/B392NativeSubFeedback.test.ts src/app/B394OriginalBombPaintNotice.test.ts src/app/B245SourcePresentation.test.ts src/app/UndertowF3SourceSessionBoard.test.ts src/app/B367RealCpuCombatTimeline.test.ts src/app/B415LiveInkLoop.test.ts src/app/B380NativePlayerWeaponGuide.test.ts src/app/B399NativeCameraAimClearance.test.ts
      - run: node --check scripts/t21-b385-native-selectable-circuit.mjs
      - run: node --check scripts/t21-b390-real-source-timeup.mjs
      - run: node --test scripts/t21-b390-native-radar-check.test.mjs
      - name: Drive actual source Chrome (short B415 or full B390)
        env:
          T21_B390_TRUE_180S: ${{ contains(github.event.head_commit.message, '[b415-short]') && '0' || '1' }}
          T21_B415_SHORT_CANONICAL: ${{ contains(github.event.head_commit.message, '[b415-short]') && '1' || '0' }}
          T21_P1_OWN_ONCE: ${{ contains(github.event.head_commit.message, '[p1-own-once]') && '1' || '0' }}
          T21_P2_COMBAT_TWIN_180_REPLAY_ONCE: ${{ contains(github.event.head_commit.message, '[p2-canonical-combat-once]') && '1' || '0' }}
        run: node scripts/t21-b385-native-selectable-circuit.mjs
      # One user-approved public ubuntu-latest run: no billed artifact
      # storage. Retain the genuine JSON and framebuffer bytes in logs.
      - name: Preserve P2 real RAW in free job logs, no artifact upload
        if: ${{ always() && contains(github.event.head_commit.message, '[p2-canonical-combat-once]') }}
        run: |
          node --input-type=module <<'P2RAW'
          import {readFileSync,existsSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const dir='/tmp/t21-b385/';
          const raw=dir+'b385-native-source.json';
          if(existsSync(raw)){
           console.log('T21_P2_GENUINE_NATIVE_JSON_BEGIN');
           console.log(readFileSync(raw,'utf8'));
           console.log('T21_P2_GENUINE_NATIVE_JSON_END');
          }else console.log('T21_P2_NO_NATIVE_JSON_HOLD');
          for(const file of ['p2-combat-timeup.png',
           'p2-combat-replay-ready.png','p2-combat-reshoot.png']){
           if(!existsSync(dir+file))continue;
           const bytes=readFileSync(dir+file);
           const sha=createHash('sha256').update(bytes).digest('hex');
           console.log('T21_P2_REAL_PNG_BEGIN '+file+' '+sha+' '+bytes.length);
           const b64=bytes.toString('base64');
           for(let i=0;i<b64.length;i+=30000)
            console.log('T21_P2_REAL_PNG_CHUNK '+file+' '+i+' '+b64.slice(i,i+30000));
           console.log('T21_P2_REAL_PNG_END '+file);
          }
          P2RAW
      - name: Preserve actual screenshots, native ticks and honest HOLD evidence
        if: ${{ always() && !contains(github.event.head_commit.message, '[p2-canonical-combat-once]') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ contains(github.event.head_commit.message, '[b415-short]') && 'b415-genuine-short-canonical-circuit' || 'b390-genuine-selected-180s-source-round' }}
          path: /tmp/t21-b385/
          retention-days: 14
          if-no-files-found: warn
