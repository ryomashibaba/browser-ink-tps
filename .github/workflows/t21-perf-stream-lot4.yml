name: T21 PERFORMANCE #21 isolated fast type/unit/build (NO CHROMIUM)
on:
  push:
    branches:
      - research/t21-v28-performance-streamed-ink-e442-20261117
    paths:
      - src/core/InkBrushRasterStream.ts
      - src/core/InkBrushRasterStream.test.ts
      - src/ink/GpuInkAtlas.ts
      - .github/workflows/t21-perf-stream-lot4.yml
permissions:
  contents: read
jobs:
  fast-performance:
    if: github.repository == 'ryomashibaba/browser-ink-tps'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Full TypeScript typecheck
        run: npm run typecheck
      - name: Relevant existing INK and PERFORMANCE Vitest
        run: npx vitest run src/core/InkBrushRasterStream.test.ts src/core/InkBrushGpuPacking.test.ts src/core/InkBrushHotPath.test.ts src/ink/InkBrushRasterGeometry.test.ts src/ink/InkPaintAuthority.test.ts
      - name: Vite browser build (NO browser execution)
        run: npm run build -- --base=/browser-ink-tps/
