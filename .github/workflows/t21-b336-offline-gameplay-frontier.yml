name: T21 B336 offline evidence plus B337 short native input source gate
on:
  push:
    branches: [dev/t21-f4e103w-qa-infra]
    paths:
      - 'scripts/t21-b336-real-gameplay-frontier.mjs'
      - 'scripts/t21-b336-real-gameplay-frontier.test.mjs'
      - 'docs/qa/evidence/T21_B335_40878994476_real_round.json.gz.b64'
      - 'docs/qa/evidence/T21_B335_40878994476_manifest.json'
      - 'scripts/t21-b337-real-input-ink-audit.mjs'
      - 'scripts/t21-b337-real-input-ink-audit.test.mjs'
      - 'scripts/t21-b337-real-input-ink-round.mjs'
      - 'scripts/t21-b339-native-cpu-activity-audit.mjs'
      - 'scripts/t21-b339-native-cpu-activity-audit.test.mjs'
      - 'src/app/UndertowF3PlayableHud.ts'
      - 'src/app/B245SourcePresentation.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-source-quality-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/t21-b336-real-gameplay-frontier.test.mjs scripts/t21-b339-native-cpu-activity-audit.test.mjs
      - name: Audit original evidence read-only without rerunning costly browser
        run: |
          node scripts/t21-b336-real-gameplay-frontier.mjs \
            docs/qa/evidence/T21_B335_40878994476_real_round.json.gz.b64 \
            docs/qa/evidence/T21_B335_40878994476_manifest.json \
            /tmp/t21-b336-source-frontier.json
      - name: B339 historic CPU painted-cells slowdown, no inferred root cause
        run: |
          node scripts/t21-b339-native-cpu-activity-audit.mjs \
            docs/qa/evidence/T21_B335_40878994476_real_round.json.gz.b64 \
            docs/qa/evidence/T21_B335_40878994476_manifest.json \
            /tmp/t21-b339-historic-frontier.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b336-genuine-source-gameplay-frontier
          path: |
            /tmp/t21-b336-source-frontier.json
            /tmp/t21-b339-historic-frontier.json
          retention-days: 14
          if-no-files-found: warn

  b337-real-short-input:
    needs: offline-source-quality-frontier
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: node --test scripts/t21-b337-real-input-ink-audit.test.mjs
      - run: npm run build -- --base=/browser-ink-tps/
      - run: node --check scripts/t21-b337-real-input-ink-round.mjs
      - name: Genuine Chromium short native WASD, mouse aim, original foot and ink
        env:
          T21_B337_OUTPUT: /tmp/t21-b337
        run: node scripts/t21-b337-real-input-ink-round.mjs
      - name: Independently validate actual short native witness and PNGs
        run: node scripts/t21-b337-real-input-ink-audit.mjs /tmp/t21-b337
      - name: B339 examine seven genuine CPU shot and owner counters in that SAME native world
        run: |
          node scripts/t21-b339-native-cpu-activity-audit.mjs \
            docs/qa/evidence/T21_B335_40878994476_real_round.json.gz.b64 \
            docs/qa/evidence/T21_B335_40878994476_manifest.json \
            /tmp/t21-b337/b339-native-cpu-activity.json \
            /tmp/t21-b337/b337-real-input-ink.json
      - name: Preserve genuine evidence or failed HOLD checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b337-genuine-native-wasd-mouse-ink-original-foot
          path: /tmp/t21-b337/
          retention-days: 14
          if-no-files-found: warn
