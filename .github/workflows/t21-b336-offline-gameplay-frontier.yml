name: T21 B336 offline audit of saved genuine 180s gameplay
on:
  push:
    branches: [dev/t21-f4e103w-qa-infra]
    paths:
      - 'scripts/t21-b336-real-gameplay-frontier.mjs'
      - 'scripts/t21-b336-real-gameplay-frontier.test.mjs'
      - 'docs/qa/evidence/T21_B335_40878994476_real_round.json.gz.b64'
      - 'docs/qa/evidence/T21_B335_40878994476_manifest.json'
      - '.github/workflows/t21-b336-offline-gameplay-frontier.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-source-quality-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/t21-b336-real-gameplay-frontier.test.mjs
      - name: Audit original evidence read-only without rerunning costly browser
        run: |
          node scripts/t21-b336-real-gameplay-frontier.mjs \
            docs/qa/evidence/T21_B335_40878994476_real_round.json.gz.b64 \
            docs/qa/evidence/T21_B335_40878994476_manifest.json \
            /tmp/t21-b336-source-frontier.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b336-genuine-source-gameplay-frontier
          path: /tmp/t21-b336-source-frontier.json
          retention-days: 14
          if-no-files-found: warn
