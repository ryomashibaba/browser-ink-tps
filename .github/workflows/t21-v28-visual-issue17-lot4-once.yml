name: T21 V28 VISUAL #17 lot4 live goals HUD regression once

on:
  push:
    branches:
      - research/t21-v28-visual-20261117
    paths:
      - '.github/workflows/t21-v28-visual-issue17-lot4-once.yml'

permissions:
  contents: read

jobs:
  scoped-display-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install existing dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Native goal, CPU status, original SOURCE + B484 regression
        run: npx vitest run src/app/B464PlayableSourceFrontlineHud.test.ts src/app/B286SourceCompactTeam.test.ts src/app/B245SourcePresentation.test.ts src/app/B480FocusedSourcePracticeCss.test.ts src/app/B475RealFrontlineReadyChallenge.test.ts src/app/B476OriginalFrontlineObjectiveLayout.test.ts src/app/B484TrueNativeA1FollowThrough.test.ts src/app/B250SourceStageReadability.test.ts
      - name: Strict TS build and Vite production bundle
        run: npm run build -- --base=/browser-ink-tps/
