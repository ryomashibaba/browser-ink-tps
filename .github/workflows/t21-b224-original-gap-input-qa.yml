name: T21 B224 real keyboard original gap KCC QA
on:
  push:
    branches: [dev/t21-f4e103w-qa-infra]
    paths:
      - 'src/main.ts'
      - 'src/app/T21B224OriginalGapInputQaApp.ts'
      - 'scripts/t21-b224-real-human-gap-input.mjs'
      - '.github/workflows/t21-b224-original-gap-input-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-player-input:
    name: B224 Chromium keyboard PlayerController original gap
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm run build -- --base=/browser-ink-tps/
      - run: node --check scripts/t21-b224-real-human-gap-input.mjs
      - name: Real input on source-only 27-solid Rapier test
        env:
          T21_B224_OUT: /tmp/t21-b224
        run: node scripts/t21-b224-real-human-gap-input.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b224-original-player-keyboard-rapier
          path: /tmp/t21-b224/
          retention-days: 14
          if-no-files-found: warn
