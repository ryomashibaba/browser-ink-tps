  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    name: B75 60Hz source ink window and frozen-authority preflight
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm run build -- --base=/browser-ink-tps/
      - run: npx vitest run src/app/UndertowF3OriginalEdgeGuidance.test.ts src/app/W10B130OriginalFlatEdge.test.ts src/app/UndertowF3LiveSourceInkActivity.test.ts src/app/UndertowF3HumanInkCoach.test.ts src/app/UndertowF3PlayableHud.test.ts src/app/B207SourceCombatRound.test.ts src/app/B209OriginalRampEdge.test.ts src/app/B211NativeBattleRoster.test.ts src/app/UndertowF3SourceTraffic.test.ts src/app/UndertowF3OriginalAllyRally.test.ts src/app/UndertowF3OriginalAllyProximity.test.ts src/app/UndertowF3OriginalAllyStandoff.test.ts src/app/UndertowF3OriginalAllySupportInk.test.ts src/app/W10B152AllyPaintProvenance.test.ts src/app/W10B154OriginalTeamInkMode.test.ts src/ai/B178OriginalSourceInkResources.test.ts src/ai/B180OriginalSourcePaintOpportunity.test.ts src/ai/B181OriginalSourceCombatSight.test.ts src/ai/B212MovingNativeProjectileAim.test.ts src/ai/B213NativeCounterfire.test.ts src/app/B214SelectedSourceBattleInk.test.ts src/ai/B215SourceWeaponReadyPaintAim.test.ts src/app/W10B155OriginalSourceConnectivityReview.test.ts src/app/W10B156OriginalGapTriage.test.ts src/app/W10B157OriginalBidirectionalSourceAudit.test.ts src/app/W10B157OriginalUnderpassPointMap.test.ts src/app/W10B158OriginalSourceFaceRecastMatch.test.ts src/app/W10B159OriginalFaceNavMeshProjection.test.ts src/app/B173OriginalUnderpassSurfaceChain.test.ts src/app/B160SourceCpuActivityView.test.ts src/app/UndertowF3SourcePaintRun.test.ts src/app/B161OriginalAllySyncPractice.test.ts src/app/B165OriginalAllyPracticeProgress.test.ts src/app/B166OriginalAllyRendezvous.test.ts src/app/B167NativeEnemyCombatCue.test.ts src/app/B168NativePracticePresentation.test.ts src/app/B169OriginalAllyAdvanceGuard.test.ts src/app/B183OriginalHumanDescent.test.ts src/app/B185OriginalDropGuidance.test.ts src/app/B186RealOriginalSourceCircuit.test.ts src/stage/undertow/UndertowSpillwayUnderpassRouteGeometry.test.ts
      - run: |
          node --test scripts/t21-w10b131-trigger-matrix.test.mjs
          node --test scripts/t21-w10b134-native-edge-cadence.test.mjs
          node --test scripts/t21-w10b135-native-combat-pulse.test.mjs
          node --test scripts/t21-w10b153-real-A1-support-ink-audit.test.mjs scripts/t21-w10b154-seven-cpu-source-coverage-audit.test.mjs
          node --check scripts/t21-w10b75-live-native-ink-hud.mjs
          node --test scripts/t21-w10b179-real-resource-economy-gate.test.mjs
          node --check scripts/t21-w10b80-native-stall-classifier.mjs
          node --test scripts/t21-w10b80-native-stall-classifier.test.mjs
  real-native-source-hud:
    name: Genuine live WebGL2 HUD original CPU ink (${{ matrix.aim }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        aim: [FIXED, SWEEP]
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm run build -- --base=/browser-ink-tps/
      - name: Actual render, mouse, 60Hz, source ink, visible HUD
        env:
          T21_W10B75_AIM: ${{ matrix.aim }}
          T21_B207_REAL_COMBAT_SELECT: ${{ matrix.aim == 'FIXED' && '1' || '0' }}
          T21_B179_NATIVE_SOURCE_RECOVERY: ${{ matrix.aim == 'SWEEP' && '1' || '0' }}
          T21_B180_NATIVE_SOURCE_PATCH_AIM: ${{ matrix.aim == 'SWEEP' && '1' || '0' }}
          T21_B182_NATIVE_ORIGINAL_COMBAT_SIGHT: ${{ matrix.aim == 'SWEEP' && '1' || '0' }}
          T21_F3_SHOT_DIR: /tmp/t21-w10b75
        run: node scripts/t21-w10b75-live-native-ink-hud.mjs
      - name: Keep real framebuffer and minimal anonymous source HUD evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w10b75-live-source-ink-${{ matrix.aim }}
          path: /tmp/t21-w10b75/
          if-no-files-found: warn
          retention-days: 14
