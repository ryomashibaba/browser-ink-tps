name: T21 B349 original-source real KCC grounded state per physical shooter shot
on:
  push:
    branches: [dev/t21-f4e103w-qa-infra]
    paths:
      - 'src/projectile/B346NativeShooterWitness.ts'
      - 'src/projectile/ProjectileSystem.ts'
      - 'src/projectile/B349SourceGroundAirWitness.test.ts'
      - 'src/projectile/B351SourceHitFeedback.ts'
      - 'src/projectile/B351SourceHitFeedback.test.ts'
      - 'src/feedback/GameFeedback.ts'
      - '.github/workflows/t21-b349-native-launch-stance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-source-ground-air-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npx vitest run src/projectile/B349SourceGroundAirWitness.test.ts src/projectile/B346NativeShooterWitness.test.ts src/projectile/B348SourceShooterAccuracyCandidate.test.ts src/projectile/B351SourceHitFeedback.test.ts
      - run: npm run build -- --base=/browser-ink-tps/
