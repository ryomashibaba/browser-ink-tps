name: T21 Phase14F real WebGL2 CPU drop review

on:
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize]
    paths:
      - "src/app/UndertowPhase14FVisualQaApp.ts"
      - "src/main.ts"
      - "src/ai/CpuAgentSystem.ts"
      - "src/stage/undertow/UndertowPhase14*"
      - "scripts/t21-phase14f-webgl2-cpu-capture.mjs"
      - ".github/workflows/t21-phase14f-webgl2.yml"

permissions:
  contents: read

concurrency:
  group: t21-phase14f-webgl2
  cancel-in-progress: true

jobs:
  phase14f-webgl2:
    if: github.head_ref == 'codex/t21-undertow-evidence-ledger'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Full TypeScript and Vite production-compatible base build
        run: npm run build -- --base=/browser-ink-tps/
      - name: Browser gate preflight and negative cases
        run: |
          node --check scripts/t21-phase14f-webgl2-cpu-capture.mjs
          node scripts/t21-phase14f-webgl2-cpu-capture.mjs --self-test
      - name: Capture real PlayCanvas WebGL2 dual CPU descent on both sides
        run: node scripts/t21-phase14f-webgl2-cpu-capture.mjs
      - name: Preserve PNG and JSON evidence even when blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t21-phase14f-real-webgl2-cpu-qa
          path: /tmp/t21-phase14f-webgl2/
          if-no-files-found: warn
          retention-days: 14
