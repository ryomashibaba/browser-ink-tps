name: T21 B345 source SHOOTER idle cooldown unit / TypeScript gate
on:
  push:
    branches: [dev/t21-f4e103w-qa-infra]
    paths:
      - 'src/projectile/B345SourceShooterOpeningCadence.ts'
      - 'src/projectile/B345SourceShooterOpeningCadence.test.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-shooter-cadence-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npx vitest run src/projectile/B345SourceShooterOpeningCadence.test.ts src/projectile/B343OriginalSourceVolleyBudget.test.ts
      - run: npm run build -- --base=/browser-ink-tps/
