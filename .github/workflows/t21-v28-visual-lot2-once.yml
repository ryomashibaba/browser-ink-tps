name: T21 V28 Visual Issue17 second lot - scoped player feedback regression
on:
  push:
    branches:
      - research/t21-v28-visual-20261117
    paths:
      - '.github/workflows/t21-v28-visual-lot2-once.yml'
permissions:
  contents: read
jobs:
  visual-lot2:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install existing exact dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Final HEAD - real aim, original-support warning, B475 HUD and glass regression
        run: npx vitest run src/app/B245SourcePresentation.test.ts src/app/B480FocusedSourcePracticeCss.test.ts src/app/B475RealFrontlineReadyChallenge.test.ts src/app/B476OriginalFrontlineObjectiveLayout.test.ts src/app/B250SourceStageReadability.test.ts src/app/UndertowF3PlayableHud.test.ts src/app/B364RealSourceCrosshair.test.ts
      - name: Full TypeScript check and Vite production bundle
        run: npm run build -- --base=/browser-ink-tps/
