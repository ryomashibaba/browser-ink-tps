name: T21 F4E103W QA launcher checks
on:
  push:
    branches:
      - 'dev/t21-f4e103w-qa-infra'
    paths:
      - 'tools/qa/w/**'
      - 'src/input/PlayerInput.ts'
      - 'src/input/PlayerInput.qa.test.ts'
      - 'src/app/UndertowF3PlayablePreviewApp.ts'
      - '.gitattributes'
      - '.github/workflows/t21-f4e103w-qa.yml'
  workflow_dispatch:
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check tools/qa/w/qa-runner.mjs
          node --check tools/qa/w/w2-stage-input.mjs
          node --check tools/qa/w/w2-worker.mjs
      - name: Assert deterministic QA against original public source
        run: node --test tools/qa/w/w2-stage-input.test.mjs
      - name: Verify permanent one-click launcher
        run: node --test tools/qa/w/qa-runner.test.mjs
      - name: Verify pinned source checksum
        shell: node {0}
        run: |
          const {readFileSync} = require('node:fs');
          const {createHash} = require('node:crypto');
          const manifest=JSON.parse(readFileSync('tools/qa/w/manifest.json','utf8'));
          if(manifest.schema!=='t21-f4e103w-qa-launcher/v1')throw Error('bad manifest');
          for(const name of ['qa-runner.mjs','w2-stage-input.mjs','w2-worker.mjs']){
            const bytes=readFileSync('tools/qa/w/'+name);
            const hash=createHash('sha256').update(bytes).digest('hex');
            if(hash!==manifest.files[name].sha256)throw Error('SHA-256 mismatch: '+name);
            console.log('SHA-256 verified',name,hash);
          }
      - name: Self test without local game
        run: node tools/qa/w/qa-runner.mjs --mode self-test
      - name: Offline missing-project fail-closed smoke
        shell: bash
        if: runner.os == 'Linux'
        run: |
          node tools/qa/w/qa-runner.mjs --mode check --root "$RUNNER_TEMP/inkqa" --project "$RUNNER_TEMP/nonexistent-source" --kit "$RUNNER_TEMP/nonexistent-kit"
          node -e "const r=require('$RUNNER_TEMP/inkqa/F4E103W_LAST_REPORT.json'); if(r.status!=='HOLD_ORIGINAL_GAME_MISSING'||r.sourceFilesChanged)process.exit(1);"
      - name: Install public dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Full project typecheck
        run: npm run typecheck
      - name: QA movement isolation tests
        run: npx vitest run src/input/PlayerInput.qa.test.ts
      - name: Apply W2 app-only patch to disposable CI workspace
        shell: node {0}
        run: |
          const {execFileSync}=require('node:child_process');
          const {writeFileSync}=require('node:fs');
          const {resolve}=require('node:path');
          const {pathToFileURL}=require('node:url');
          (async()=>{
            const patch=await import(pathToFileURL(resolve('tools/qa/w/w2-stage-input.mjs')).href);
            const base='413a0acdfdb2b0f74550b653fa78fff9c0f5727d';
            const player=execFileSync('git',['show',base+':src/input/PlayerInput.ts'],{encoding:'utf8'});
            const app=execFileSync('git',['show',base+':src/app/UndertowF3PlayablePreviewApp.ts'],{encoding:'utf8'});
            const updated=patch.patchSources(player,app);
            if(updated.player!==player)throw Error('Original PlayerInput changed');
            writeFileSync('src/input/PlayerInput.ts',updated.player);
            writeFileSync('src/app/UndertowF3PlayablePreviewApp.ts',updated.app);
            console.log('W2 APP-ONLY PATCH APPLIED TO EPHEMERAL CI WORKSPACE');
          })().catch(e=>{console.error(e);process.exitCode=1;});
      - name: Full QA-patched typecheck
        run: npm run typecheck
      - name: Build isolated QA preview
        run: npm run build
      - name: PowerShell script parser
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors=$null
          $tokens=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/qa/w/bootstrap.ps1').Path,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          Write-Output 'PowerShell parser PASS'
