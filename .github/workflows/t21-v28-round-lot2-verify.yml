name: T21 V28 ROUND lot2 temporary focused verification
on:
  push:
    branches:
      - research/t21-v28-round-lot2-20261117
    paths:
      - .github/workflows/t21-v28-round-lot2-verify.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  round-lot2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm run typecheck
      - name: Verify ROUND lifecycle, launcher, session recap, replay and HP0
        run: npx vitest run src/app/B207SourceCombatRound.test.ts src/app/B389NativeSourceRoundReplay.test.ts src/app/B463SourceReplayMemory.test.ts src/app/NativeSourceRoundActionWindow.test.ts src/app/B473RealSourceCombatLifeReadout.test.ts src/app/SourcePlayPortal.test.ts src/app/UndertowF3SourceSessionBoard.test.ts
      - name: Production browser build without publishing
        run: npm run build -- --base=/browser-ink-tps/
# Rerun after strict TypeScript index signature fixes in ROUND tests.
