name: T21 B312 true lower original second human paint source
on:
  push:
    branches: [dev/t21-f4e103w-qa-infra]
    paths:
      - 'src/app/B312NativeOriginalSecondHumanInk.ts'
      - 'src/app/B312NativeOriginalSecondHumanInk.test.ts'
      - 'scripts/t21-w10b139-original-native-descent-rally.mjs'
      - '.github/workflows/t21-b312-real-lower-second-original-ink.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t21-b312-second-original-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-lower-surface:
    name: Genuine B162 descent and B312 true human original surface ledger
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npx vitest run src/app/B312NativeOriginalSecondHumanInk.test.ts
      - run: npm run build -- --base=/browser-ink-tps/
      - run: node --check scripts/t21-w10b139-original-native-descent-rally.mjs
      - name: Actual player original descent and bounded true lower shooting
        env:
          T21_B139_VARIANT: ALLY_RALLY
          T21_B162_REAL_ALLY_SYNC: '1'
          T21_B194_REAL_PLAYER_BUTTON: '1'
          T21_B200_REAL_REPLAY: '1'
          T21_B201_REAL_PAUSE_RESUME: '1'
          T21_B202_REAL_CONTROLS: '1'
          T21_B203_REAL_FULL_ROUND: '1'
          T21_B312_SECOND_HUMAN_SURFACE: '1'
          T21_F3_SHOT_DIR: /tmp/t21-b312
        run: node scripts/t21-w10b139-original-native-descent-rally.mjs
      - name: Preserve actual attempts even when cross-surface paint remains HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b312-real-original-human-second-source-ink
          path: /tmp/t21-b312/
          if-no-files-found: warn
          retention-days: 14
