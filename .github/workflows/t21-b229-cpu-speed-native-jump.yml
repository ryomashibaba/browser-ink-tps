name: T21 B229 native CPU-speed jump feasibility
on:
  push:
    branches: [dev/t21-f4e103w-qa-infra]
    paths:
      - 'scripts/T21B229CpuSpeedOriginalGapKcc.test.ts'
      - '.github/workflows/t21-b229-cpu-speed-native-jump.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b229-real-native-cpu-speed-kcc:
    name: B229 unchanged CPU speed and acceleration on real Rapier source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm run build -- --base=/browser-ink-tps/
      - name: Real CPU-speed Rapier KCC original mirrored gap feasibility
        run: npx vitest run scripts/T21B229CpuSpeedOriginalGapKcc.test.ts --reporter=verbose
