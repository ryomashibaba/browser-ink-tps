name: T21 W10-B110 real KeyA start phase near B105 original direct corridor
on:
  push:
    branches: [dev/t21-f4e103w-qa-infra]
    paths:
      - 'scripts/t21-w10b110-independent-lateral-timing.mjs'
      - '.github/workflows/t21-w10b110-real-keya-timing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-original-keya-timing:
    name: True Chrome original KeyA start Z=${{ matrix.keya_z }}
    runs-on: ubuntu-latest
    timeout-minutes: 19
    strategy:
      fail-fast: false
      matrix:
        keya_z: ['65.55', '65.68']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --no-package-lock
      - name: Verify native script, original source and 9 classification regressions
        run: |
          node --check scripts/t21-w10b110-independent-lateral-timing.mjs
          node --test scripts/t21-w10b106-original-contact-classifier.test.mjs
          npm run build -- --base=/browser-ink-tps/
      - name: Actual real KeyD/KeyA/KeyW input with original Rapier KCC and strict 7 CPU direct-recovery gate
        env:
          T21_B110_RIGHT_PULSE_TICKS: '6'
          T21_B110_RELEASE_Z: '64.60'
          T21_B110_CORRECTION_PHASE: EARLY
          T21_B110_KEYA_TRIGGER_Z: ${{ matrix.keya_z }}
          T21_B110_EVIDENCE_DIR: /tmp/t21-w10b110
        run: node scripts/t21-w10b110-independent-lateral-timing.mjs
      - name: Retain failed input geometry and real source 7 CPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w10b110-real-KeyA-trigger-${{ matrix.keya_z }}
          path: /tmp/t21-w10b110/
          if-no-files-found: warn
          retention-days: 14
