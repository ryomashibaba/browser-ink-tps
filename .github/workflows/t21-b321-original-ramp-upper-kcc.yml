name: T21 B321 actual original ramp higher-section KCC
on:
  push:
    branches: [dev/t21-f4e103w-qa-infra]
    paths:
      - 'scripts/t21-b321-real-upper-ramp-kcc.mjs'
      - 'scripts/t21-b321-real-upper-ramp-kcc.test.mjs'
      - '.github/workflows/t21-b321-original-ramp-upper-kcc.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t21-b321-original-high-ramp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-upper-ramp:
    name: Original real human physical upper ramp KCC
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: node --test scripts/t21-b313-actual-original-cell-aim.test.mjs scripts/t21-b315-verify-native-three-surface-ink.test.mjs scripts/t21-b316-native-human-ramp-walk.test.mjs scripts/t21-b318-original-ramp-interior.test.mjs scripts/t21-b319-audit-real-ramp-kcc-artifact.test.mjs scripts/t21-b320-original-ramp-uphill-kcc.test.mjs scripts/t21-b321-real-upper-ramp-kcc.test.mjs
      - run: npm run build -- --base=/browser-ink-tps/
      - run: node --check scripts/t21-w10b139-original-native-descent-rally.mjs
      - name: True original human KCC from spawn through upper-ramp
        env:
          T21_B139_VARIANT: ALLY_RALLY
          T21_B162_REAL_ALLY_SYNC: '1'
          T21_B194_REAL_PLAYER_BUTTON: '1'
          T21_B200_REAL_REPLAY: '0'
          T21_B201_REAL_PAUSE_RESUME: '0'
          T21_B202_REAL_CONTROLS: '0'
          T21_B203_REAL_FULL_ROUND: '1'
          T21_B312_SECOND_HUMAN_SURFACE: '1'
          T21_B316_GENUINE_RAMP_WALK: '1'
          T21_B318_INTERIOR_RAMP_WALK: '1'
          T21_B320_TRUE_SOURCE_RAMP_UPHILL: '1'
          T21_B321_TRUE_UPPER_RAMP_KCC: '1'
          T21_F3_SHOT_DIR: /tmp/t21-b321
        run: node scripts/t21-w10b139-original-native-descent-rally.mjs
      - name: Independently verify 3 original human-painted surfaces
        run: node scripts/t21-b315-verify-native-three-surface-ink.mjs /tmp/t21-b321/b312-real-original-lower-second-ink.json
      - name: Independently verify lower-to-original ramp human KCC
        run: node scripts/t21-b319-audit-real-ramp-kcc-artifact.mjs /tmp/t21-b321/b316-genuine-original-human-ramp-walk.json
      - name: Independently verify source ramp real first uphill
        run: node scripts/t21-b320-original-ramp-uphill-kcc.mjs /tmp/t21-b321/b320-genuine-original-ramp-uphill.json
      - name: Independently classify further high-ramp native KCC
        run: node scripts/t21-b321-real-upper-ramp-kcc.mjs /tmp/t21-b321/b321-true-original-upper-ramp.json
      - name: Save native physical human source route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b321-genuine-original-high-ramp
          path: /tmp/t21-b321/
          retention-days: 14
          if-no-files-found: warn
