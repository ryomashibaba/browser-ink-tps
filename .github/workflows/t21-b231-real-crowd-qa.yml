name: T21 B231 true Recast Crowd proxy handoff after original Rapier landing
on:
  push:
    branches: [dev/t21-f4e103w-qa-infra]
    paths:
      - 'src/ai/B231CrowdLandingHandoffQa.ts'
      - 'scripts/T21B231NativeCrowdRejoin.test.ts'
      - '.github/workflows/t21-b231-real-crowd-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b231-genuine-recast-crowd:
    name: B231 native Recast Crowd and real KCC physical landing handoff
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm run build -- --base=/browser-ink-tps/
      - name: Strict original physics and native Crowd QA
        run: npx vitest run scripts/T21B231NativeCrowdRejoin.test.ts scripts/T21B230CpuLocalGapActuator.test.ts --reporter=verbose
