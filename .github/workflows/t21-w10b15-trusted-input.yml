name: T21 W10-B15 trusted mouse input to CPU lifecycle
on:
  push:
    branches: [dev/t21-f4e103w-qa-infra]
    paths:
      - 'src/app/UndertowF3PlayablePreviewApp.ts'
      - 'src/camera/ThirdPersonCamera.ts'
      - 'src/app/UndertowF3PlayableHud.ts'
      - 'src/app/UndertowF3PlayableHud.test.ts'
      - 'src/app/UndertowF3SourceTraffic.ts'
      - 'src/app/UndertowF3PaintAwarePatrol.ts'
      - 'src/app/UndertowF3PaintAwarePatrol.test.ts'
      - 'src/ai/OriginalSourceNativeTargetRefresh.ts'
      - 'src/ai/OriginalSourceNativeTargetRefresh.test.ts'
      - 'src/ai/CpuAgentSystem.ts'
      - 'scripts/t21-w10b32-compare-real-source.mjs'
      - 'src/input/PlayerInput.ts'
      - 'src/camera/ThirdPersonCamera.ts'
      - 'src/projectile/ProjectileSystem.ts'
      - 'src/ink/GpuInkAtlas.ts'
      - 'scripts/t21-f3-browser-smoke.mjs'
      - 'scripts/t21-w10b15-pixel-diff.mjs'
      - '.github/workflows/t21-w10b15-trusted-input.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trusted-input-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install public dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Build real PlayCanvas browser bundle
        run: npm run build -- --base=/browser-ink-tps/
      - name: W10-B17 source-only HUD authority and 3-minute vitals tests
        run: npx vitest run src/app/UndertowF3PlayableHud.test.ts
      - name: Test source native goal refresh without false navigation and real ownerGrid ranking
        run: npx vitest run src/app/UndertowF3PaintAwarePatrol.test.ts src/ai/OriginalSourceNativeTargetRefresh.test.ts
      - name: Check CDP test syntax
        run: node --check scripts/t21-f3-browser-smoke.mjs
      - name: Prove pointer-locked actual mouse input through native CPU splat and respawn
        env:
          T21_W10B15_TRUSTED_INPUT: '1'
        run: node scripts/t21-f3-browser-smoke.mjs
      - name: Certify native CPU visible respawn from identical-camera real PNG pixels
        run: node scripts/t21-w10b15-pixel-diff.mjs /tmp/t21-f3-playable-webgl2
      - name: W10-B32 original source native fixed-patrol baseline at same 1080 physics ticks
        env:
          T21_W10B16_NATURAL_AI: '1'
          T21_W10B31_INK_AWARE: '0'
          T21_W10B34_ALIGN: '1'
          T21_W10B20_PROFILE: '1'
        run: |
          node scripts/t21-f3-browser-smoke.mjs
          cp /tmp/t21-f3-playable-webgl2/w10b16-native-autonomous-real-chrome.json /tmp/t21-f3-playable-webgl2/w10b32-fixed-original-baseline.json
      - name: W10-B35 real source fixed patrol with sparse native Crowd goal refresh, 7 actual CPU
        env:
          T21_W10B16_NATURAL_AI: '1'
          T21_W10B31_INK_AWARE: '0'
          T21_W10B35_NATIVE: '1'
          T21_W10B34_ALIGN: '1'
          T21_W10B20_PROFILE: '1'
        run: |
          node scripts/t21-f3-browser-smoke.mjs
          cp /tmp/t21-f3-playable-webgl2/w10b16-native-autonomous-real-chrome.json /tmp/t21-f3-playable-webgl2/w10b32-ink-aware-original.json
      - name: W10-B35 compare original real fixed vs sparse native Crowd requests, keep default frozen
        env:
          T21_W10B35_NATIVE: '1'
        run: node scripts/t21-w10b32-compare-real-source.mjs /tmp/t21-f3-playable-webgl2/w10b32-fixed-original-baseline.json /tmp/t21-f3-playable-webgl2/w10b32-ink-aware-original.json /tmp/t21-f3-playable-webgl2/w10b35-fixed-vs-sparse-native.json
      - name: Preserve real Chromium frames and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t21-w10b15-source-only-real-input
          path: /tmp/t21-f3-playable-webgl2/
          retention-days: 14
          if-no-files-found: warn
