name: T21 W10-B116/B117/B118 genuine forward real Crowd drift witness
on:
  push:
    branches: [dev/t21-f4e103w-qa-infra]
    paths:
      - 'scripts/t21-w10b112-genuine-human-floor-walk.mjs'
      - 'src/stage/undertow/UndertowPhase14QRealCrowdDriftWitness.ts'
      - 'src/stage/undertow/UndertowPhase14QRealCrowdDriftWitness.test.ts'
      - 'src/stage/undertow/UndertowPhase14QHumanCrowdAnchor.ts'
      - 'src/app/UndertowF3NativeHumanCrowd.ts'
      - 'src/stage/undertow/UndertowPhase14QHumanCrowdAnchor.ts'
      - 'src/stage/undertow/UndertowPhase14QProjectedProxySeal.ts'
      - 'src/stage/undertow/UndertowPhase14QProjectedProxySeal.test.ts'
      - '.github/workflows/t21-w10b116-genuine-forward-original-floor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  true-forward-original-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --no-package-lock
      - name: Verify real-input syntax and original runtime build
        run: |
          node --check scripts/t21-w10b112-genuine-human-floor-walk.mjs
          npx vitest run src/app/W10B112HumanGroundLedger.test.ts src/app/W10B113NativeFloorTrace.test.ts src/app/W10B114OriginalFootprintAudit.test.ts src/stage/undertow/UndertowPhase14QProjectedProxySeal.test.ts src/stage/undertow/UndertowPhase14QRealCrowdDriftWitness.test.ts
          npm run build -- --base=/browser-ink-tps/
      - name: Real Chromium 480 native ticks physical forward, no teleport
        env:
          T21_B116_FORWARD_NATIVE_TICKS: '480'
          T21_B112_EVIDENCE_DIR: /tmp/t21-w10b116-real-forward
        run: node scripts/t21-w10b112-genuine-human-floor-walk.mjs
      - name: Preserve TRUE source-support changes and genuine fall witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w10b116-true-original-forward-floor-evidence
          path: /tmp/t21-w10b116-real-forward/
          if-no-files-found: warn
          retention-days: 14
