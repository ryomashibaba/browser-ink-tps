name: T21 V28 ROUND temporary focused verification
on:
  push:
    branches:
      - research/t21-v28-round-20261117
    paths:
      - .github/workflows/t21-v28-round-temporary-verify.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  round-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm run typecheck
      - name: Run genuine V28 ROUND and adjacent SOURCE tests
