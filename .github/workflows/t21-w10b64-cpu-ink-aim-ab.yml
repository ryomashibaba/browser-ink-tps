name: T21 W10-B64 real original-source CPU paint A-B
on:
  push:
    branches: [dev/t21-f4e103w-qa-infra]
    paths:
      # B180: shared CPU changes are preflighted by B75 real WebGL2
      # and core QA; historical 130s A/B now runs on its own source
      # paint algorithm and native-comparison script changes only.
      - 'src/ai/UndertowF3OriginalSourceInkSweep.ts'
      - 'src/ai/UndertowF3OriginalSourceInkSweep.test.ts'
      - 'scripts/t21-w10b64-compare-native-ink.mjs'
      - 'scripts/t21-w10b64-compare-native-ink.test.mjs'
      - 'scripts/t21-w10b65-replication-gate.mjs'
      - 'scripts/t21-w10b65-replication-gate.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preflight-unit:
    name: B67 fast preflight before expensive 130s browser experiments
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/t21-w10b64-compare-native-ink.mjs
      - run: node --check scripts/t21-w10b65-replication-gate.mjs
      - run: node --check scripts/t21-f3-browser-smoke.mjs
      - run: node --test scripts/t21-w10b64-compare-native-ink.test.mjs scripts/t21-w10b65-replication-gate.test.mjs
      - name: The original 25/17/26/0 authority and 0 Turf score stay HOLD
        run: echo 'B67_PASS_MODEL_PRECHECK_NOT_B66_NATIVE_COMPARE_PASS'
  native-source-ab:
    name: Real 130-second original-source CPU (${{ matrix.mode }})
    needs: preflight-unit
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        mode: [FIXED, SWEEP]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm run build -- --base=/browser-ink-tps/
      - run: npx vitest run src/ai/UndertowF3OriginalSourceInkSweep.test.ts src/app/UndertowF3NativeSessionEvidence.test.ts src/app/UndertowF3CpuInkTempo.test.ts
      - run: node --check scripts/t21-f3-browser-smoke.mjs
      - run: node --test scripts/t21-w10b64-compare-native-ink.test.mjs
      - name: Real original FIXED / optional source-ink sweep without synthetic ticks
        env:
          T21_W10B64_SOURCE_INK_AIM: ${{ matrix.mode }}
          T21_F3_SHOT_DIR: /tmp/t21-w10b64
        run: node scripts/t21-f3-browser-smoke.mjs
      - name: Preserve true CPU projectiles, ink and ticks on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w10b64-source-${{ matrix.mode }}
          path: /tmp/t21-w10b64/w10b64-native-${{ matrix.mode }}.json
          if-no-files-found: warn
          retention-days: 14
  evidence-comparison:
    name: Compare source ink objectively; no automatic CPU adoption
    needs: native-source-ab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/t21-w10b64-compare-native-ink.test.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: w10b64-source-*
          path: b64-evidence
          merge-multiple: true
      - name: Compare actual real CPU ink evidence only
        run: node scripts/t21-w10b64-compare-native-ink.mjs b64-evidence

  prior-evidence-review:
    name: Replay independently verified previous exact B64 130s native artifacts
    needs: preflight-unit
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          run-id: 39432637747
          github-token: ${{ github.token }}
          pattern: w10b64-source-*
          path: b64-prior
          merge-multiple: true
      - run: node --test scripts/t21-w10b64-compare-native-ink.test.mjs
      - run: node scripts/t21-w10b64-compare-native-ink.mjs b64-prior

  independent-replication-gate:
    name: Both genuine 130s A-B repeats agree; still NO CPU default change
    needs: [native-source-ab, evidence-comparison, prior-evidence-review]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/t21-w10b65-replication-gate.test.mjs
      - uses: actions/download-artifact@v4
        with:
          run-id: 39432637747
          github-token: ${{ github.token }}
          pattern: w10b64-source-*
          path: b64-prior
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: w10b64-source-*
          path: b64-repeat
          merge-multiple: true
      - run: node scripts/t21-w10b65-replication-gate.mjs b64-prior b64-repeat
