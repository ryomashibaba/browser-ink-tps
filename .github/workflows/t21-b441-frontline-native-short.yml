          node --input-type=module -e '
            import {readdirSync,readFileSync} from "node:fs";
            const root="/tmp/t21-b441-short-native-frontline";
            const files=readdirSync(root).filter(file=>file.endsWith(".json"));
            for(const required of [
              "b486-original-human-7cpu-enemy-distance-60hz.json",
              "b487-real-original-16-cross-team-route-audit.json",
              "b488-real-original-f4-gap-authority-hold.json"
            ])if(!files.includes(required))throw Error("REQUIRED_NATIVE_JSON_MISSING_"+required);
            for(const file of files){
              const parsed=JSON.parse(readFileSync(root+"/"+file,"utf8"));
              if(!parsed||typeof parsed!=="object")
                throw Error("NATIVE_JSON_OBJECT_INVALID_"+file);
              console.log("VALIDATED_NATIVE_JSON "+file);
            }
          '
      - name: Validate real SOURCE D-key diagnostic (not route evidence)
        if: ${{ contains(github.event.head_commit.message, '[p1-input-diagnostic-once]') }}
        run: |
          node --input-type=module <<'P1_INPUT'
          import {readFileSync} from 'node:fs';
          const d=JSON.parse(readFileSync(
           '/tmp/t21-b441-short-native-frontline/b440-short-real-original-human-foot.json',
           'utf8'));
          const f=d.p1NativeInputDiagnostic;
          if(!f||!f.realKeyDDispatched||!Array.isArray(f.trace)||
             f.trace.length<3||f.nativeHumanTeleportWrites!==0||
             f.stageGeometryWrites!==0||f.sourceAuthority!=='25/17/26/0'||
             f.sourceRampWalkCertified!==false||
             f.officialCrossTeamRouteCertified!==false||
             !f.classification||d.p0BlockedStagingRealWVerified!==true||
             !d.p1NativeLowerEdge||d.p1NativeLowerEdge.physicalCpuRejoins!==7||
             d.p1NativeLowerEdge.stopReason!==null||
             d.verdict!=='PASS_DIAGNOSTIC_CAPTURED_ROUTE_STILL_HOLD')
           throw Error('P1_REAL_D_KEY_WITNESS_MISSING');
          console.log('P1_REAL_NATIVE_D_INPUT_DIAGNOSTIC_ONLY',
           JSON.stringify({classification:f.classification,
            bodyXZDelta:f.actualBodyXZDelta,
            samples:f.trace.map(t=>({phase:t.phase,tick:t.tick,
             body:t.body,axes:t.input?.nativeInputAxes,
             yaw:t.input?.yawDegrees,locked:t.input?.realPointerLockAtSampling,
             desired:t.input?.projectedWorldIntent}))}));
          P1_INPUT
      - name: Preserve real SOURCE evidence even if HOLD
        if: ${{ always() && !contains(github.event.head_commit.message, '[sweep-audit-only]') && !contains(github.event.head_commit.message, '[p1-evidence-audit-only]') && !contains(github.event.head_commit.message, '[p1-local-cue-audit-only]') }}
        uses: actions/upload-artifact@v4
        with:
          name: b441-true-native-source-frontline-short
          path: /tmp/t21-b441-short-native-frontline/
          if-no-files-found: warn
          retention-days: 14
