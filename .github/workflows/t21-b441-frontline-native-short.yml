name: T21 B441 true short original CPU frontline goal trial
on:
  push:
    branches: [research/t21-b406-single-session-real-enemy-range-audit-20261103, research/t21-integrated-a1-c-patrol-four-mode-20261105]
    paths:
      - 'scripts/t21-b440-short-native-original-foot.mjs'
      - 'PLAY_SOURCE_WINDOWS.cmd'
      - 'play-source.html'
      - 'src/main.ts'
      - 'src/app/B286SourceCompactTeam.ts'
      - 'src/app/B286SourceCompactTeam.test.ts'
      - 'src/app/B464PlayableSourceFrontlineHud.ts'
      - 'src/app/B464PlayableSourceFrontlineHud.test.ts'
      - 'src/app/UndertowF3PlayableHud.ts'
      - 'src/app/UndertowF3PlayableHud.test.ts'
      - 'src/app/B245SourcePresentation.ts'
      - 'src/app/B245SourcePresentation.test.ts'
      - 'src/app/B480FocusedSourcePracticeCss.test.ts'
      - 'src/source-play-main.ts'
      - 'src/app/SourcePlayPortal.ts'
      - 'src/app/SourcePlayPortal.test.ts'
      - 'scripts/t21-source-play-windows-launcher.test.mjs'
      - 'src/app/B441OriginalSourceFrontline.ts'
      - 'src/app/B441OriginalSourceFrontline.test.ts'
      - 'src/app/UndertowF3SourceTraffic.ts'
      - 'src/app/UndertowF3PaintAwarePatrol.ts'
      - 'src/app/UndertowF3PaintAwarePatrol.test.ts'
      - 'src/app/B450OriginalRouteWitness.ts'
      - 'src/app/B450OriginalRouteWitness.test.ts'
      - 'scripts/t21-b450-real-b2-b4-gap-audit.mjs'
      - 'scripts/t21-b452-native-foot-vs-recast-audit.mjs'
      - 'scripts/t21-b452-native-foot-vs-recast-audit.test.mjs'
      - 'src/app/B454NativeSourceFootTrace.ts'
      - 'src/app/B454NativeSourceFootTrace.test.ts'
      - 'scripts/t21-b454-real-native-full-rate-source-foot.mjs'
      - 'scripts/t21-b454-real-native-full-rate-source-foot.test.mjs'
      - 'src/app/B473RealSourceCombatLifeReadout.ts'
      - 'src/app/B473RealSourceCombatLifeReadout.test.ts'
      - 'src/app/B474OriginalFrontSteeringRefresh.ts'
      - 'src/app/B474OriginalFrontSteeringRefresh.test.ts'
      - 'src/app/B475RealFrontlineReadyChallenge.ts'
      - 'src/app/B475RealFrontlineReadyChallenge.test.ts'
      - 'src/app/B476OriginalFrontlineObjectiveLayout.ts'
      - 'src/app/B476OriginalFrontlineObjectiveLayout.test.ts'
      - 'src/app/B477ActualSourceCpuJoinCue.ts'
      - 'src/app/B477ActualSourceCpuJoinCue.test.ts'
      - 'src/app/B481ActualSourcePaintOpportunity.ts'
      - 'src/app/B481ActualSourcePaintOpportunity.test.ts'
      - 'src/app/B483RealFrontlineTeammateCommand.ts'
      - 'src/app/B483RealFrontlineTeammateCommand.test.ts'
      - 'src/app/B484TrueNativeA1FollowThrough.ts'
      - 'src/app/B484TrueNativeA1FollowThrough.test.ts'
      - 'src/app/B485RealRepeatA1Command.ts'
      - 'src/app/B485RealRepeatA1Command.test.ts'
      - 'src/app/B486NativeSourceEncounterTrace.ts'
      - 'src/app/B486NativeSourceEncounterTrace.test.ts'
      - 'src/app/B487TrueOriginalCrossTeamTopology.ts'
      - 'src/app/B487TrueOriginalCrossTeamTopology.test.ts'
      - 'src/app/B488OriginalCrossTeamGapDecision.ts'
      - 'src/app/B488OriginalCrossTeamGapDecision.test.ts'
      - 'src/app/UndertowF3SourcePaintRun.ts'
      - 'src/app/UndertowF3SourcePaintRun.test.ts'
      - 'src/app/UndertowF3PlayablePreviewApp.ts'
      - 'src/app/UndertowF3SourceSessionBoard.ts'
      - 'src/app/UndertowF3SourceSessionBoard.test.ts'
      - 'src/app/B463SourceReplayMemory.ts'
      - 'src/app/B463SourceReplayMemory.test.ts'
      - 'src/camera/ThirdPersonCamera.ts'
      - 'src/camera/ThirdPersonCamera.test.ts'
      - 'src/audio/SourcePracticeAudio.ts'
      - 'src/audio/SourcePracticeAudio.test.ts'
      - '.github/workflows/t21-b441-frontline-native-short.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: t21-b441-short-frontline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-native-original-frontline:
    runs-on: ubuntu-latest
    # One explicit genuine >3600 native-tick case; ordinary pushes stay short.
    timeout-minutes: ${{ contains(github.event.head_commit.message, '[true-full-replay]') && 80 || ((contains(github.event.head_commit.message, '[true-expiry]') || contains(github.event.head_commit.message, '[real-q-once]') || contains(github.event.head_commit.message, '[real-sweep-once]') || contains(github.event.head_commit.message, '[real-sweep-clear]')) && 35 || 15) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact SOURCE runtime
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Verify true native runner source and compile game
        run: |
          node --check scripts/t21-b440-short-native-original-foot.mjs
          node --test scripts/t21-source-play-windows-launcher.test.mjs
          node --check scripts/t21-b452-native-foot-vs-recast-audit.mjs
          node --test scripts/t21-b452-native-foot-vs-recast-audit.test.mjs
          node --check scripts/t21-b454-real-native-full-rate-source-foot.mjs
          node --test scripts/t21-b454-real-native-full-rate-source-foot.test.mjs
          npx vitest run src/app/B488OriginalCrossTeamGapDecision.test.ts src/app/B487TrueOriginalCrossTeamTopology.test.ts src/app/B486NativeSourceEncounterTrace.test.ts src/app/B485RealRepeatA1Command.test.ts src/app/B484TrueNativeA1FollowThrough.test.ts src/app/B483RealFrontlineTeammateCommand.test.ts src/app/B286SourceCompactTeam.test.ts src/app/B481ActualSourcePaintOpportunity.test.ts src/app/B480FocusedSourcePracticeCss.test.ts src/app/UndertowF3PaintAwarePatrol.test.ts src/app/B441OriginalSourceFrontline.test.ts src/app/B421RealEnemyStandoff.test.ts src/app/B473RealSourceCombatLifeReadout.test.ts src/app/B474OriginalFrontSteeringRefresh.test.ts src/app/B475RealFrontlineReadyChallenge.test.ts src/app/B476OriginalFrontlineObjectiveLayout.test.ts src/app/B477ActualSourceCpuJoinCue.test.ts src/app/UndertowF3SourcePaintRun.test.ts src/ai/OriginalSourceNativeTargetRefresh.test.ts src/app/B367RealCpuCombatTimeline.test.ts src/app/B443OriginalFrontHold.test.ts src/app/B450OriginalRouteWitness.test.ts src/app/B454NativeSourceFootTrace.test.ts src/camera/ThirdPersonCamera.test.ts src/audio/SourcePracticeAudio.test.ts src/app/SourcePlayPortal.test.ts src/app/B464PlayableSourceFrontlineHud.test.ts src/app/UndertowF3PlayableHud.test.ts src/app/UndertowF3SourceSessionBoard.test.ts src/app/B463SourceReplayMemory.test.ts src/app/OriginalSourceCombatRetreat.test.ts
          npm run build -- --base=/browser-ink-tps/
      # Use exactly the immutable successful Chromium evidence from run
      # 42309574066, not synthetic playback or a second 39-minute game.
      - name: Retrieve exact existing full 180s SOURCE Chromium evidence for read-only audit
        if: ${{ contains(github.event.head_commit.message, '[audit-only]') }}
        uses: actions/download-artifact@v4
        with:
          name: b441-true-native-source-frontline-short
          run-id: 42309574066
          github-token: ${{ github.token }}
          path: /tmp/t21-b441-short-native-frontline
      # Reuse immutable actual Chromium RAW; no new native game or 7-CPU run.
      - name: Retrieve exact B58 3-surface native CLEAR RAW for read-only re-audit
        if: ${{ contains(github.event.head_commit.message, '[sweep-audit-only]') }}
        uses: actions/download-artifact@v4
        with:
          name: b441-true-native-source-frontline-short
          run-id: 42363774075
          github-token: ${{ github.token }}
          path: /tmp/t21-b441-short-native-frontline
      - name: Verify only B452 evidence-gate changes and original run provenance
        if: ${{ contains(github.event.head_commit.message, '[audit-only]') }}
        run: |
          node --input-type=module <<'AUDIT'
          import {execFileSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          const from='2fbc44cf719af124500dcd768421a289f155efa5';
          const changed=execFileSync('git',['diff','--name-only',from,'HEAD'],
           {encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const allowed=new Set([
           'scripts/t21-b452-native-foot-vs-recast-audit.mjs',
           'scripts/t21-b452-native-foot-vs-recast-audit.test.mjs',
           '.github/workflows/t21-b441-frontline-native-short.yml']);
          if(changed.length!==3||changed.some(p=>!allowed.has(p)))
           throw Error('AUDIT_ONLY_UNAUTHORIZED_GAME_OR_SOURCE_CHANGE');
          const f='/tmp/t21-b441-short-native-frontline/b440-short-real-original-human-foot.json';
          const d=JSON.parse(readFileSync(f,'utf8'));
          if(d?.verdict!=='PASS_REAL_NATIVE_180S_TIME_UP_REPLAY_NEW_WORLD_SAME_HUMAN_WEAPON'||
           d?.browserOrigin!==d?.oneShotFullReplay?.initialOrigin||
           d?.oneShotFullReplay?.actualCountdownNativeTicks<10800||
           d?.full180sCertified!==true||d?.genuineReplayClickCertified!==true)
           throw Error('AUDIT_ONLY_PRIOR_GENUINE_SOURCE_ARTIFACT_NOT_VERIFIED');
          console.log('FROZEN_TRUE_CHROMIUM_ARTIFACT_SOURCE_APPROVED_FOR_READ_ONLY_AUDIT');
          AUDIT
      - name: One real native browser with 7 original CPU and B441 opt-in
        if: ${{ !contains(github.event.head_commit.message, '[audit-only]') && !contains(github.event.head_commit.message, '[sweep-audit-only]') }}
        env:
          T21_B441_SOURCE_FRONTLINE: '1'
          T21_B441_REAL_Q_ONCE: ${{ contains(github.event.head_commit.message, '[real-q-once]') && '1' || '0' }}
          T21_B441_REAL_SWEEP_ONCE: ${{ (contains(github.event.head_commit.message, '[real-sweep-once]') || contains(github.event.head_commit.message, '[real-sweep-clear]')) && '1' || '0' }}
          T21_B441_REAL_SWEEP_CLEAR: ${{ contains(github.event.head_commit.message, '[real-sweep-clear]') && '1' || '0' }}
          T21_B441_NATIVE_OBSERVE_TICKS: '720'
          # Enabled only for one deliberate source-expiry proof commit.
          T21_B441_PROVE_60S_EXPIRY: ${{ contains(github.event.head_commit.message, '[true-expiry]') && '1' || '0' }}
          T21_B441_PROVE_FULL_180S_REPLAY: ${{ contains(github.event.head_commit.message, '[true-full-replay]') && '1' || '0' }}
          T21_B440_OUT: /tmp/t21-b441-short-native-frontline
        run: node scripts/t21-b440-short-native-original-foot.mjs
      - name: Verify exactly one real canonical combat KeyQ and native screenshots
        if: ${{ contains(github.event.head_commit.message, '[real-q-once]') }}
        run: |
          node --input-type=module <<'Q_REAL'
          import {readFileSync,statSync} from 'node:fs';
          const path='/tmp/t21-b441-short-native-frontline/';
          const q=JSON.parse(readFileSync(path+'q-real-combat-once.json','utf8'));
          if(q.verdict!=='PASS_REAL_CDP_KEYQ_SAME_SOURCE_WORLD'||
           q.source!=='25/17/26/0'||q.realKey!=='KeyQ'||
           q.practiceBefore!=='TIME_UP'||q.practiceAfter!=='RUNNING'||
           q.practiceElapsedBefore<3600||q.remainingBefore<60||
           q.remainingAfter>q.remainingBefore||q.tickAfter<=q.tickBefore||
           q.sameBrowserWorld!==true||q.sameSevenCpu!==true||
           q.actorWrites!==0||q.inkWrites!==0||q.clockWrites!==0||
           q.scoreWrites!==0||q.officialWinner!=='NONE'||
           q.formal4v4Certified!==false||q.images?.length!==2)
            throw Error('Q_GENUINE_CANONICAL_COMBAT_ONE_SHOT_HOLD');
          for(const file of q.images){
           const b=readFileSync(path+file);
           if(statSync(path+file).size<10000||
            b.readUInt32BE(16)!==1600||b.readUInt32BE(20)!==900)
             throw Error('Q_GENUINE_REAL_CHROME_PNG_HOLD');
          }
          console.log('Q_REAL_KEY_SAME_WORLD_PASS');
          Q_REAL
      - name: Independently verify real canonical SOURCE_SWEEP selection, native CPU 7/7 and untouched score
        if: ${{ contains(github.event.head_commit.message, '[real-sweep-once]') || contains(github.event.head_commit.message, '[real-sweep-clear]') || contains(github.event.head_commit.message, '[sweep-audit-only]') }}
        env:
          T21_B58_EXPECT_REAL_CLEAR: ${{ (contains(github.event.head_commit.message, '[real-sweep-clear]') || contains(github.event.head_commit.message, '[sweep-audit-only]')) && '1' || '0' }}
          T21_B58_READ_ONLY_PINNED: ${{ contains(github.event.head_commit.message, '[sweep-audit-only]') && '1' || '0' }}
        run: |
          node --input-type=module <<'REAL_SWEEP'
          import {readFileSync,statSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const dir='/tmp/t21-b441-short-native-frontline/';
          if(process.env.T21_B58_READ_ONLY_PINNED==='1'){
           // The native run comes from the previous exact immutable SHA.
           // Allow ONLY this workflow and the future screenshot-manifest
           // metadata patch since that real gameplay implementation.
           const native='d8f39f91e1fe840c76c5f5abaca8ea6ce57aae7e';
           const parent=execFileSync('git',['rev-parse','HEAD^'],{
            encoding:'utf8'}).trim();
           const changed=execFileSync('git',['diff','--name-only',native,'HEAD'],{
            encoding:'utf8'}).trim().split('\n').filter(Boolean).sort();
           const allowed=[
            '.github/workflows/t21-b441-frontline-native-short.yml',
            'scripts/t21-b440-short-native-original-foot.mjs'];
           if(parent!==native||JSON.stringify(changed)!==JSON.stringify(allowed))
            throw Error('B58_PINNED_NATIVE_SHA_OR_UNAUTHORIZED_GAME_CHANGE');
          }
          const d=JSON.parse(readFileSync(dir+'b58-real-source-sweep-once.json','utf8'));
          const rows=d.certifiedOriginalSurfaceInk;
          const full=process.env.T21_B58_EXPECT_REAL_CLEAR==='1';
          if(d.schema!=='T21_B58_CANONICAL_REAL_CDP_SOURCE_SWEEP_ENTRY_V1'||
             d.verdict!==(full?
              'PASS_REAL_SOURCE_SWEEP_3_SURFACES_60_EACH_AND_12M':
              'PASS_REAL_PLAYER_SOURCE_SWEEP_FIRST_ORIGINAL_HUMAN_PAINT')||
             d.actualThreeSurfaceClearCertified!==full||
             d.source!=='25/17/26/0'||d.selectedRealMode!=='SOURCE_SWEEP'||
             d.realModeClicks!==3||d.readyTick!==0||
             d.physicalCpuBefore!==0||d.physicalCpuAfter!==7||
             !Number.isSafeInteger(d.firstRunTick)||d.firstRunTick<1||
             d.afterShotTick<=d.firstRunTick||d.realHumanShots<1||
             d.genuinePointerLockedMouseAim!==true||
             !Number.isFinite(d.cameraPitchBefore)||
             !Number.isFinite(d.cameraPitchAfter)||
             d.cameraPitchAfter>=d.cameraPitchBefore-10||
             d.cameraPitchAfter> -30||
             !Number.isSafeInteger(d.nativeOriginalHumanChangedCells)||
             d.nativeOriginalHumanChangedCells<1||
             !Number.isSafeInteger(d.actualPaintedOriginalSurfaces)||
             d.actualPaintedOriginalSurfaces<1||
             !Array.isArray(rows)||rows.length>17||
             rows.some(x=>typeof x.surfaceId!=='string'||
              !x.surfaceId.startsWith('UndertowT21D:')||
              !Number.isSafeInteger(x.changedCells)||x.changedCells<0)||
             rows.reduce((n,x)=>n+x.changedCells,0)!==d.nativeOriginalHumanChangedCells||
             d.actualPaintedOriginalSurfaces!==rows.filter(x=>x.changedCells>0).length||
             d.actualQualifiedOriginalSurfaces!==
              rows.filter(x=>x.changedCells>=60).length||
             d.sameBrowserWorld!==true||
             d.originalCameraShoulderPreserved!==true||
             d.syntheticTicks!==0||d.actorWrites!==0||d.inkWrites!==0||
             d.scoreWrites!==0||d.nativeClockWrites!==0||
             d.officialWinner!=='NONE'||d.formal4v4Certified!==false||
             ![2,3].includes(d.screenshots?.length))
           throw Error('B58_FALSE_REAL_SOURCE_SWEEP_ENTRY_OR_NATIVE_INK');
          for(const file of d.screenshots){
           const p=readFileSync(dir+file);
           if(statSync(dir+file).size<10000||
              p.readUInt32BE(16)!==1600||p.readUInt32BE(20)!==900)
            throw Error('B58_TRUE_CHROMIUM_SCREENSHOT_NOT_REAL');
          }
          if(full){
           const f=JSON.parse(readFileSync(dir+'b58-real-full-source-sweep-route.json','utf8'));
           const p=f.final?.practice,parts=p?.sweptOriginalSurfaceCellProgress;
           const exact=new Set([
            'UndertowT21D:spawn-high-positive-z:paint',
            'UndertowT21D:first-drop-landing-positive-z:paint',
            'UndertowT21D:right-low-route-ramp-positive-z:paint']);
           if(f.schema!=='T21_B58_TRUE_CANONICAL_SOURCE_SWEEP_PHYSICAL_ROUTE'||
              f.source!=='25/17/26/0'||
              f.verdict!=='PASS_REAL_CDP_THREE_DIFFERENT_ORIGINAL_SURFACES_AND_12M'||
              f.threeSurfaceClearCertified!==true||
              f.originalSourceWrites!==0||f.actorWrites!==0||
              f.inkWrites!==0||f.clockWrites!==0||f.scoreWrites!==0||
              f.syntheticKeyboard!==false||f.officialWinner!=='NONE'||
              f.final?.genuineSevenCpu!==true||p?.status!=='CLEAR'||
              p.practiceVariant!=='SOURCE_SWEEP'||p.officialWinner!=='NONE'||
              p.originalStageVerified!==true||
              p.qualifiedOriginalSweepSurfaces<3||
              p.humanChangedImpactCells<180||
              p.realGroundedTravelMeters<12||
              p.elapsedTicks>3600||
              !Array.isArray(parts)||parts.length>17||
              ![...exact].every(id=>parts.some(x=>
               x.surfaceId===id&&Number.isSafeInteger(x.changedCells)&&
               x.changedCells>=60))||
              ![2,3].includes(d.screenshots?.length))
            throw Error('B58_FALSE_THREE_ORIGINAL_SURFACE_60_EACH_REAL_CLEAR');
           // Original actual RUN had all three true PNGs, but the B58
           // summary contained only the two startup images. Verify the
           // third REAL CLEAR screenshot from actual retained file bytes.
           const requiredImages=[
            'source-sweep-real-selected-before-shot.png',
            'source-sweep-real-after-human-shot.png',
            'source-sweep-real-three-surface-clear.png'];
           if(!d.screenshots.every((f,i)=>f===requiredImages[i]))
            throw Error('B58_NONCANONICAL_REAL_SOURCE_PNG_MANIFEST');
           for(const file of requiredImages){
            const png=readFileSync(dir+file);
            if(statSync(dir+file).size<10000||
               png.subarray(0,8).toString('hex')!=='89504e470d0a1a0a'||
               png.readUInt32BE(16)!==1600||png.readUInt32BE(20)!==900)
             throw Error('B58_MISSING_TRUE_NATIVE_CLEAR_PNG');
           }
           // Check sequential genuine KCC and native owner-grid witnesses
           // instead of trusting only the self-declared practice verdict.
           const steps=f.evidence;
           if(!Array.isArray(steps)||steps.length<8||
              steps.some((row,i)=>
               !Number.isSafeInteger(row.nativeTick)||
               !Number.isFinite(row.realGroundMeters)||
               !Number.isSafeInteger(row.humanNewSourceCells)||
               (i>0&&(
                steps[i-1].nativeTick>row.nativeTick||
                steps[i-1].realGroundMeters>row.realGroundMeters+.03||
                steps[i-1].humanNewSourceCells>row.humanNewSourceCells)))||
              !steps.some(row=>row.phase==='REAL_ORIGINAL_FIRST_DROP'&&
               row.originalFoot?.physicalKccGrounded===true&&
               row.originalFoot?.originalSolid===
                'UndertowT21D:first-drop-landing-positive-z')||
              ![...exact].slice(1).every(id=>steps.some(row=>
               row.phase==='REAL_SOURCE_SHOOT_'+id&&
               row.realOriginalTargetCells>=60&&
               Number.isFinite(row.actualAim?.yaw)&&
               Number.isFinite(row.actualAim?.pitch)))||
              steps.at(-1)?.status!=='CLEAR'||
              steps.at(-1)?.nativeTick!==f.final.tick||
              steps.at(-1)?.humanNewSourceCells!==p.humanChangedImpactCells||
              steps.at(-1)?.realGroundMeters!==p.realGroundedTravelMeters||
              !Array.isArray(f.final.originalHumanImpactLedger)||
              f.final.originalHumanImpactLedger.reduce(
               (total,row)=>total+row.changedCells,0)!==p.humanChangedImpactCells)
            throw Error('B58_TRUE_NATIVE_ROUTE_OR_OWNER_LEDGER_CONFLICT');
           console.log(process.env.T21_B58_READ_ONLY_PINNED==='1'?
            'B58_IMMUTABLE_ORIGINAL_3_SURFACE_60_EACH_12M_READONLY_PASS':
            'B58_TRUE_NATIVE_THREE_ORIGINAL_SURFACES_60_EACH_12M_PASS');
          }else{
           if(d.screenshots?.length!==2)
            throw Error('B58_ONE_SHOT_PNG_COUNT_HOLD');
           console.log('B58_REAL_SOURCE_SWEEP_GENUINE_FIRST_ORIGINAL_PAINT_PASS');
          }
          REAL_SWEEP
      - name: B450 independent genuine CPU B2 B4 first original path denial audit
        if: ${{ !contains(github.event.head_commit.message, '[real-q-once]') && !contains(github.event.head_commit.message, '[real-sweep-once]') && !contains(github.event.head_commit.message, '[real-sweep-clear]') && !contains(github.event.head_commit.message, '[sweep-audit-only]') }}
        run: node scripts/t21-b450-real-b2-b4-gap-audit.mjs /tmp/t21-b441-short-native-frontline/b440-short-real-original-human-foot.json
      - name: B452 read-only actual B2 B4 physical-foot vs rejected Recast coordinates in SAME original native world
        if: ${{ !contains(github.event.head_commit.message, '[real-q-once]') && !contains(github.event.head_commit.message, '[real-sweep-once]') && !contains(github.event.head_commit.message, '[real-sweep-clear]') && !contains(github.event.head_commit.message, '[sweep-audit-only]') }}
        run: node scripts/t21-b452-native-foot-vs-recast-audit.mjs /tmp/t21-b441-short-native-frontline/b440-short-real-original-human-foot.json
      - name: B454 independent every-native-tick B2 B4 original Rapier SOURCE physical foot audit
        if: ${{ !contains(github.event.head_commit.message, '[real-q-once]') && !contains(github.event.head_commit.message, '[real-sweep-once]') && !contains(github.event.head_commit.message, '[real-sweep-clear]') && !contains(github.event.head_commit.message, '[sweep-audit-only]') }}
        run: node scripts/t21-b454-real-native-full-rate-source-foot.mjs /tmp/t21-b441-short-native-frontline/
      - name: Validate stored genuine native JSON evidence files
        if: ${{ !contains(github.event.head_commit.message, '[real-q-once]') && !contains(github.event.head_commit.message, '[real-sweep-once]') && !contains(github.event.head_commit.message, '[real-sweep-clear]') && !contains(github.event.head_commit.message, '[sweep-audit-only]') }}
        run: |
          node --input-type=module -e '
            import {readdirSync,readFileSync} from "node:fs";
            const root="/tmp/t21-b441-short-native-frontline";
            const files=readdirSync(root).filter(file=>file.endsWith(".json"));
            for(const required of [
