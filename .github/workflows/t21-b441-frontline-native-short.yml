permissions:
  contents: read
  actions: read
concurrency:
  group: t21-b441-short-frontline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # P0 gameplay hot-path candidate: TYPECHECK + browser BUNDLE ONLY.
  # Never launch native 7-CPU Chromium, read protected Windows files,
  # alter stage physics, or rerun the already-proven 180s K3.
  p0-radar-build-only:
    if: ${{ github.ref == 'refs/heads/research/t21-integrated-a1-c-patrol-four-mode-20261105' && (contains(github.event.head_commit.message, '[p0-radar-build-only]') || contains(github.event.head_commit.message, '[p0-first-stop-build-only]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact source dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Focused original SOURCE traffic regression
        run: |
          node --test scripts/t21-source-play-windows-launcher.test.mjs scripts/t21-f3gl-restore.test.mjs
          node --check scripts/t21-w10b139-original-native-descent-rally.mjs
          node --test scripts/t21-b492-source-height-isolation.test.mjs
          npx vitest run src/app/UndertowF3SourceSessionBoard.test.ts src/app/UndertowF3SourceTraffic.test.ts src/app/UndertowF3SourceTraffic.LiveRejoin.test.ts src/app/B245SourcePresentation.test.ts src/app/UndertowF3OriginalVisualRegistration.test.ts src/app/UndertowF3RadarElevation.test.ts src/stage/undertow/UndertowPhase14QFirstDropPassiveProxyGate.test.ts src/app/UndertowF3NativeHumanCrowd.test.ts src/app/UndertowF3SourceFloorAuthority.test.ts src/app/W10B112HumanGroundLedger.test.ts src/app/UndertowF3GWholeSourcePreview.test.ts src/app/UndertowF3LTexturedSourcePreview.test.ts src/camera/ThirdPersonCamera.test.ts src/camera/ThirdPersonCamera.combat.test.ts src/camera/UndertowF3SmartOcclusion.test.ts src/app/B248SourceActorVisuals.test.ts src/app/UndertowF3PaintAwarePatrol.test.ts src/app/B441OriginalSourceFrontline.test.ts src/app/B443OriginalFrontHold.test.ts src/stage/undertow/UndertowW10EightSeamSourceCandidates.test.ts
      - name: Existing ink-cell and real registered player resource regressions
        run: npx vitest run src/stage/undertow/UndertowW9NativeCpuPaintProjectileQa.test.ts src/ai/B178OriginalSourceInkResources.test.ts src/ai/CpuAgentSystem.F3LethalLifecycle.test.ts src/projectile/B343OriginalSourceVolleyBudget.test.ts src/projectile/B345SourceShooterOpeningCadence.test.ts src/ink/PaintSurface.test.ts src/stage/undertow/UndertowPhase14NRealPlayerProjectileQa.test.ts
      # B493 pinned RAW only. No Chromium or source gameplay simulation.
      - name: Download immutable original B2 B4 60Hz Chromium foot ledger
        if: ${{ contains(github.event.head_commit.message, '[b493-kcc-readonly]') }}
        uses: actions/download-artifact@v4
        with:
          name: b441-true-native-source-frontline-short
          run-id: 43140584988
          github-token: ${{ github.token }}
          path: /tmp/t21-b493-pinned-real
      - name: Recheck actual CPU-size capsule steps vs native Rapier and Recast
        if: ${{ contains(github.event.head_commit.message, '[b493-kcc-readonly]') }}
        env:
          T21_B493_EVIDENCE_DIR: /tmp/t21-b493-pinned-real
          T21_B493_REPORT_PATH: /tmp/t21-b493-kcc-report.json
        run: |
          npx vitest run src/stage/undertow/UndertowB493OriginalCpuKccReplay.test.ts
          node -e "const d=require('/tmp/t21-b493-kcc-report.json');if(d.source!=='25/17/26/0'||d.originalOpponentRoutesAuthorized!==0||Object.keys(d.actors||{}).length!==2)process.exit(1);console.log('B493_READONLY_INDEPENDENT_KCC_DIAGNOSTIC_RECORDED')"
      - name: Preserve one immutable CPU KCC diagnostic report
        if: ${{ contains(github.event.head_commit.message, '[b493-kcc-readonly]') && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: b493-readonly-cpu-rapier-recast-report
          path: /tmp/t21-b493-kcc-report.json
          if-no-files-found: warn
          retention-days: 14
      # B494: read the same original Chromium A1/B2/B4 native 60Hz feet.
      # No new browser, stage permission, artificial actor or navigation.
      - name: Download immutable genuine A1 B2 B4 same-world native foot traces
        if: ${{ contains(github.event.head_commit.message, '[b494-continuous-shared]') }}
        uses: actions/download-artifact@v4
        with:
          name: b441-true-native-source-frontline-short
          run-id: 43140584988
          github-token: ${{ github.token }}
          path: /tmp/t21-b494-source-evidence
      - name: Integrate three original-sized Rapier CPU capsules without per-frame reseeding
        if: ${{ contains(github.event.head_commit.message, '[b494-continuous-shared]') }}
        env:
          T21_B494_EVIDENCE_DIR: /tmp/t21-b494-source-evidence
          T21_B494_REPORT_PATH: /tmp/t21-b494-continuous-3cpu.json
        run: |
          npx vitest run src/stage/undertow/UndertowB494SameWorldThreeCpuContinuousKcc.test.ts
          node -e "const d=require('/tmp/t21-b494-continuous-3cpu.json');if(d.source!=='25/17/26/0'||d.continuousStepsPerCpu!==671||d.eachFrameReanchoredToActualFoot||d.naturalOpposingRoutesAuthorized!==0)process.exit(1);console.log('B494_BOUNDED_CONTINUOUS_3CPU_DIAGNOSTIC_SAVED')"
      - name: Archive B494 3CPU continuous KCC result from pinned genuine RAW
        if: ${{ contains(github.event.head_commit.message, '[b494-continuous-shared]') && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: b494-original-three-cpu-continuous-report
          path: /tmp/t21-b494-continuous-3cpu.json
          if-no-files-found: warn
          retention-days: 14
      # B495 side-by-side original 25 vs local 3 SOURCE solids Recast Y.
      # Only pinned RAW; no true Chromium/world/official route writes.
      - name: Retrieve pinned B450 and B454 original registered Source feet
        if: ${{ contains(github.event.head_commit.message, '[b495-nav-y-isolation]') }}
        uses: actions/download-artifact@v4
        with:
          name: b441-true-native-source-frontline-short
          run-id: 43140584988
          github-token: ${{ github.token }}
          path: /tmp/t21-b495-pinned-original
      - name: Compare exact source faces Rapier support and full vs local original Recast height
        if: ${{ contains(github.event.head_commit.message, '[b495-nav-y-isolation]') }}
        env:
          T21_B495_EVIDENCE_DIR: /tmp/t21-b495-pinned-original
          T21_B495_REPORT_PATH: /tmp/t21-b495-original-nav-y-report.json
        run: |
          npx vitest run src/stage/undertow/UndertowB495OriginalRecastHeightFaceIsolation.test.ts
          node -e "const d=require('/tmp/t21-b495-original-nav-y-report.json');if(d.source!=='25/17/26/0'||d.firstDeniedPathPointCount!==60||d.sourceFaceYDiscrepancies!==0||d.originalOpponentRoutesAuthorized!==0)process.exit(1);console.log('B495_ORIGINAL_FACE_NAV_READONLY_DIAGNOSTIC_SAVED')"
      - name: Preserve B495 exact-floor vs Recast full/local Y gap evidence
        if: ${{ contains(github.event.head_commit.message, '[b495-nav-y-isolation]') && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: b495-source-face-nav-height-isolation
          path: /tmp/t21-b495-original-nav-y-report.json
          if-no-files-found: warn
          retention-days: 14
      # B496 real original B450 rejected 0.30m route points: raw vs
      # genuine Recast nearest-poly query. Diagnostic only, no route promotion.
      - name: Retrieve pinned B450 original denied routes and genuine B454 feet
        if: ${{ contains(github.event.head_commit.message, '[b496-route-reprojection]') }}
        uses: actions/download-artifact@v4
        with:
          name: b441-true-native-source-frontline-short
          run-id: 43140584988
          github-token: ${{ github.token }}
          path: /tmp/t21-b496-pinned-original
      - name: Replay 60 actual original route denials and compare projected full-path support
        if: ${{ contains(github.event.head_commit.message, '[b496-route-reprojection]') }}
        env:
          T21_B496_EVIDENCE_DIR: /tmp/t21-b496-pinned-original
          T21_B496_REPORT_PATH: /tmp/t21-b496-reprojected-path.json
        run: |
          npx vitest run src/app/UndertowB496RealRejectedRouteReprojectionQa.test.ts
          node -e "const d=require('/tmp/t21-b496-reprojected-path.json');if(d.originalSource!=='25/17/26/0'||d.originalRejectionFirstSamplesReproduced!==60||d.counterfactualFullPathRayPasses+d.counterfactualFullPathRayHeld!==60||d.originalCrossTeamRoutesAuthorized!==0)process.exit(1);console.log('B496_REAL_REJECTION_ALL_PATHS_READONLY_SAVED')"
      - name: Archive B496 pinned real denial vs path-projection report
        if: ${{ contains(github.event.head_commit.message, '[b496-route-reprojection]') && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: b496-source-recast-route-y-reprojection
          path: /tmp/t21-b496-reprojected-path.json
          if-no-files-found: warn
          retention-days: 14
      # B497 pinned original 60 paths only; no new true-browser world.
      - name: Download immutable B450 B454 B487 B488 for B497
        if: ${{ contains(github.event.head_commit.message, '[b497-path-kcc]') }}
        uses: actions/download-artifact@v4
        with:
          name: b441-true-native-source-frontline-short
          run-id: 43140584988
          github-token: ${{ github.token }}
          path: /tmp/t21-b497-pinned-original
      - name: Locate ten real rejected floor points and KCC-check fifty projected source paths
        if: ${{ contains(github.event.head_commit.message, '[b497-path-kcc]') }}
        env:
          T21_B497_EVIDENCE_DIR: /tmp/t21-b497-pinned-original
          T21_B497_REPORT_PATH: /tmp/t21-b497-report.json
        run: |
          npx vitest run src/app/UndertowB497TenUnresolvedAndKccContinuityQa.test.ts
          node -e "const d=require('/tmp/t21-b497-report.json');if(d.schema!=='B497_TRUE_ORIGINAL_TEN_AND_FIFTY_STATIC_CPU_KCC_SPEED_V1'||d.originalSource!=='25/17/26/0'||d.tenUnresolvedOriginalRoutes.length!==10||d.totalIsolatedStaticKccPathsTested!==50||d.speedLimitedKccPathsDiagnosed!==50||d.speedLimitedKccWithinQaOnlyThreshold+d.speedLimitedKccHeld!==50||d.originalCrossTeamRoutesAuthorized!==0)process.exit(1);console.log('B497_REPRODUCIBLE_SAFE_DIAGNOSTIC_ONLY')"
      - name: Archive B497 all sixty source routes and real CPU-size KCC diagnostics
        if: ${{ contains(github.event.head_commit.message, '[b497-path-kcc]') && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: b497-true-ten-source-failures-and-fifty-static-kcc
          path: /tmp/t21-b497-report.json
          if-no-files-found: warn
          retention-days: 14
      # B499 genuine eight CI688 face-seam probes on unchanged 25 source
      # solids. No browser, added geometry, KCC route, or staged scoring.
      - name: Audit exact eight original-source face seams against current live Recast and Rapier
        if: ${{ contains(github.event.head_commit.message, '[b499-eight-source-seams]') }}
        env:
          T21_B499_REPORT_PATH: /tmp/t21-b499-original-eight-seams.json
        run: |
          npx vitest run src/app/B499OriginalEightSeamsLiveRapierRecast.test.ts
          node -e "const d=require('/tmp/t21-b499-original-eight-seams.json');if(d.schema!=='B499_REAL_8_CI688_FACE_SEAMS_CURRENT_RECAST_RAPIER_V1'||d.originalSource!=='25/17/26/0'||d.originalSourceTriangles!==42||d.seamDetails.length!==8||d.newFloorOrNavLinkAdded!==0||d.nativeCrossTeamTraversalCertified!==false)process.exit(1);console.log('B499_REAL_ORIGINAL_EIGHT_SEAMS_DID_NOT_PROMOTE')"
      - name: Archive B499 authenticated source-face-to-original-stage 8-seam audit
        if: ${{ contains(github.event.head_commit.message, '[b499-eight-source-seams]') && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: b499-genuine-original-eight-source-face-seams
          path: /tmp/t21-b499-original-eight-seams.json
          if-no-files-found: warn
          retention-days: 14
      - name: Existing short native runner syntax and binding preflight
        run: |
          node --check scripts/t21-b440-short-native-original-foot.mjs
          node --input-type=module <<'NATIVE_BINDINGS'
          import ts from 'typescript';
          import {readFileSync} from 'node:fs';
          const file='scripts/t21-b440-short-native-original-foot.mjs';
          const source=readFileSync(file,'utf8');
          const begin=source.indexOf('async function runK3CanonicalOneWorld(');
          const end=source.indexOf('\nasync function main()',begin);
          if(begin<0||end<=begin)throw Error('NATIVE_RUNNER_SCOPE_MISSING');
          const program=ts.createProgram([file],{
            allowJs:true,checkJs:true,noEmit:true,skipLibCheck:true,
            target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.NodeNext,
            moduleResolution:ts.ModuleResolutionKind.NodeNext
          });
          const errors=ts.getPreEmitDiagnostics(program).filter(d=>
            d.file?.fileName.endsWith(file)&&d.start>=begin&&d.start<end&&
            [2304,2552,2663].includes(d.code));
          if(errors.length)throw Error(errors.map(d=>
            ts.flattenDiagnosticMessageText(d.messageText,' ')).join('; '));
          console.log('NATIVE_RUNNER_BINDINGS_PASS_NO_BROWSER_EXECUTION');
          NATIVE_BINDINGS
      - name: TypeScript check and real browser bundle compilation only
        run: npm run build -- --base=/browser-ink-tps/
      - name: One-shot genuine 11-face V23 Rapier, ephemeral verified source
        if: ${{ contains(github.event.head_commit.message, '[p0-v23-original-face-once]') }}
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d "${RUNNER_TEMP}/t21-v23-source.XXXXXXXX")"
          trap 'rm -rf "$work"' EXIT
          curl --fail --location --silent --show-error \
            --connect-timeout 10 --max-time 120 --retry 0 \
            'https://media.githubusercontent.com/media/kirakira-dev/KiTrix/main/stages/Vss_Temple01/Vss_Temple01.obj' \
            --output "$work/Vss_Temple01.obj"
          mkdir -p "$work/verified_pack"
          node scripts/t21-f3g-source-pack.mjs \
            "$work/Vss_Temple01.obj" "$work/verified_pack"
          T21_V23_PINNED_FLOOR_BIN="$work/verified_pack/original-floor.bin" \
            npx vitest run src/app/UndertowF3GWholeSourcePreview.test.ts \
            -t 'V23 authentic pinned original 11-face isolated real Rapier'
  real-native-original-frontline:
    # B385 already runs real 7CPU for this one camera-input milestone.
    # A single explicit short native 3D-foot evidence run may coexist with
    # P0 radar; all unrelated heavy SOURCE 180s workflows still skip P0.
    if: ${{ !contains(github.event.head_commit.message, '[b415-short]') && !contains(github.event.head_commit.message, '[p1-own-retry]') && (!contains(github.event.head_commit.message, '[p0-radar-build-only]') || contains(github.event.head_commit.message, '[p1-native-goal3d-once]') || contains(github.event.head_commit.message, '[p1-native-b443-once]')) && !contains(github.event.head_commit.message, '[p0-first-stop-build-only]') && !startsWith(github.event.head_commit.message, '[a1-fall-r-native-once]') }}
    runs-on: ubuntu-latest
    # One explicit genuine >3600 native-tick case; ordinary pushes stay short.
    timeout-minutes: ${{ (contains(github.event.head_commit.message, '[true-full-replay]') || contains(github.event.head_commit.message, '[k3-one-world]')) && 80 || ((contains(github.event.head_commit.message, '[true-expiry]') || contains(github.event.head_commit.message, '[real-q-once]') || contains(github.event.head_commit.message, '[real-sweep-once]') || contains(github.event.head_commit.message, '[real-sweep-clear]') || contains(github.event.head_commit.message, '[real-charger-once]')) && 35 || 15) }}
    steps:
