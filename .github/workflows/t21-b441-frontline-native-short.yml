      - 'src/audio/SourcePracticeAudio.test.ts'
      - '.github/workflows/t21-b441-frontline-native-short.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t21-b441-short-frontline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-native-original-frontline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact SOURCE runtime
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Verify true native runner source and compile game
        run: |
          node --check scripts/t21-b440-short-native-original-foot.mjs
          node --test scripts/t21-source-play-windows-launcher.test.mjs
          node --check scripts/t21-b452-native-foot-vs-recast-audit.mjs
          node --test scripts/t21-b452-native-foot-vs-recast-audit.test.mjs
          node --check scripts/t21-b454-real-native-full-rate-source-foot.mjs
          node --test scripts/t21-b454-real-native-full-rate-source-foot.test.mjs
          npx vitest run src/app/B488OriginalCrossTeamGapDecision.test.ts src/app/B487TrueOriginalCrossTeamTopology.test.ts src/app/B486NativeSourceEncounterTrace.test.ts src/app/B485RealRepeatA1Command.test.ts src/app/B484TrueNativeA1FollowThrough.test.ts src/app/B483RealFrontlineTeammateCommand.test.ts src/app/B286SourceCompactTeam.test.ts src/app/B481ActualSourcePaintOpportunity.test.ts src/app/B480FocusedSourcePracticeCss.test.ts src/app/UndertowF3PaintAwarePatrol.test.ts src/app/B441OriginalSourceFrontline.test.ts src/app/B421RealEnemyStandoff.test.ts src/app/B473RealSourceCombatLifeReadout.test.ts src/app/B474OriginalFrontSteeringRefresh.test.ts src/app/B475RealFrontlineReadyChallenge.test.ts src/app/B476OriginalFrontlineObjectiveLayout.test.ts src/app/B477ActualSourceCpuJoinCue.test.ts src/app/UndertowF3SourcePaintRun.test.ts src/ai/OriginalSourceNativeTargetRefresh.test.ts src/app/B367RealCpuCombatTimeline.test.ts src/app/B443OriginalFrontHold.test.ts src/app/B450OriginalRouteWitness.test.ts src/app/B454NativeSourceFootTrace.test.ts src/camera/ThirdPersonCamera.test.ts src/audio/SourcePracticeAudio.test.ts src/app/SourcePlayPortal.test.ts src/app/B464PlayableSourceFrontlineHud.test.ts src/app/UndertowF3PlayableHud.test.ts src/app/UndertowF3SourceSessionBoard.test.ts src/app/B463SourceReplayMemory.test.ts
          npm run build -- --base=/browser-ink-tps/
      - name: One real native browser with 7 original CPU and B441 opt-in
        env:
          T21_B441_SOURCE_FRONTLINE: '1'
          T21_B441_NATIVE_OBSERVE_TICKS: '720'
          T21_B440_OUT: /tmp/t21-b441-short-native-frontline
        run: node scripts/t21-b440-short-native-original-foot.mjs
      - name: B450 independent genuine CPU B2 B4 first original path denial audit
        run: node scripts/t21-b450-real-b2-b4-gap-audit.mjs /tmp/t21-b441-short-native-frontline/b440-short-real-original-human-foot.json
      - name: B452 read-only actual B2 B4 physical-foot vs rejected Recast coordinates in SAME original native world
        run: node scripts/t21-b452-native-foot-vs-recast-audit.mjs /tmp/t21-b441-short-native-frontline/b440-short-real-original-human-foot.json
      - name: B454 independent every-native-tick B2 B4 original Rapier SOURCE physical foot audit
        run: node scripts/t21-b454-real-native-full-rate-source-foot.mjs /tmp/t21-b441-short-native-frontline/
      - name: Validate stored genuine native JSON evidence files
        run: |
          node --input-type=module -e '
            import {readdirSync,readFileSync} from "node:fs";
            const root="/tmp/t21-b441-short-native-frontline";
            const files=readdirSync(root).filter(file=>file.endsWith(".json"));
            for(const required of [
              "b486-original-human-7cpu-enemy-distance-60hz.json",
              "b487-real-original-16-cross-team-route-audit.json",
              "b488-real-original-f4-gap-authority-hold.json"
            ])if(!files.includes(required))throw Error("REQUIRED_NATIVE_JSON_MISSING_"+required);
            for(const file of files){
              const parsed=JSON.parse(readFileSync(root+"/"+file,"utf8"));
              if(!parsed||typeof parsed!=="object")
                throw Error("NATIVE_JSON_OBJECT_INVALID_"+file);
              console.log("VALIDATED_NATIVE_JSON "+file);
            }
          '
      - name: Preserve real SOURCE evidence even if HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b441-true-native-source-frontline-short
          path: /tmp/t21-b441-short-native-frontline/
          if-no-files-found: warn
          retention-days: 14
