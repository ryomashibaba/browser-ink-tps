      # Keep the long frozen Pass18 regression independent of headless Chrome.

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

 
  t21-visual-evidence:
    name: T21 fast five-view WebGPU evidence
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout exact T21 PR revision
        uses: actions/checkout@v6

      - name: Setup Node.js for visual review
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pinned browser InkTPS build dependencies
        run: npm install --no-audit --no-fund

      - name: Build real source-grounded review app
        run: npm run build -- --base=/browser-ink-tps/

      - name: T21 bounded five-view headless WebGPU capture
        id: five_view
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/t21-review-five-view-capture.mjs

      - name: Always upload five-view captures or explicit BLOCKED manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-real-five-view-capture
          path: /tmp/t21-review-five-view
          if-no-files-found: warn
          retention-days: 14

