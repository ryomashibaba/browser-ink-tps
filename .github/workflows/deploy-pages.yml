name: Build and deploy Ink TPS to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    # On ordinary PR synchronize, t21-fast-feedback.yml runs all unit + type.
    # Full original/Pass18/browser evidence runs on opening/reopen/review/label.
    types: [opened, reopened, ready_for_review, labeled]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore T21 Temple01 LFS cache
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/cache@v4
        with:
          path: /tmp/kitrix-lfs-cache/Vss_Temple01.obj
          key: t21-temple01-lfs-a32cff26b1a142d31e7658ebc48f213059b3ea42e86d32ed12cb80de5b03d046

      - name: Prepare verified T21 Temple01 geometry source
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kitrix-lfs
          mkdir -p /tmp/kitrix-lfs
          if [ -f /tmp/kitrix-lfs-cache/Vss_Temple01.obj ]; then
            cp /tmp/kitrix-lfs-cache/Vss_Temple01.obj /tmp/kitrix-lfs/Vss_Temple01.obj
            echo "T21RAY cache=HIT"
          else
            mkdir -p /tmp/kitrix-lfs-cache
            cd /tmp/kitrix-lfs
            git init -q
            git remote add origin https://github.com/kirakira-dev/KiTrix.git
            git lfs install --local
            cat > temple01.pointer <<'PTR'
          version https://git-lfs.github.com/spec/v1
          oid sha256:a32cff26b1a142d31e7658ebc48f213059b3ea42e86d32ed12cb80de5b03d046
          size 43263289
          PTR
            timeout 180s git lfs smudge < temple01.pointer > Vss_Temple01.obj
            cp Vss_Temple01.obj /tmp/kitrix-lfs-cache/Vss_Temple01.obj
            echo "T21RAY cache=MISS"
          fi
          test "$(stat -c%s /tmp/kitrix-lfs/Vss_Temple01.obj)" = "43263289"
          echo "a32cff26b1a142d31e7658ebc48f213059b3ea42e86d32ed12cb80de5b03d046  /tmp/kitrix-lfs/Vss_Temple01.obj" | sha256sum -c -
          echo "T21SOURCE verified_bytes=43263289 sha256=a32cff26b1a142d31e7658ebc48f213059b3ea42e86d32ed12cb80de5b03d046"

      - name: T21 Temple01 Pass 18C upper-terrain source audit
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        shell: bash
        run: python scripts/undertow-temple01-upper-terrain-audit.py /tmp/kitrix-lfs/Vss_Temple01.obj

      - name: T21 Phase12B original OBJ vertex-ID connected-component graph
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        shell: bash
        run: |
          python scripts/undertow-temple01-phase12b-component-graph.py --self-test
          python scripts/undertow-temple01-phase12b-component-graph.py /tmp/kitrix-lfs/Vss_Temple01.obj /tmp/t21-phase11-central-nearest-source-geometry.json /tmp/t21-phase12b-original-vertex-components.json

      - name: Upload T21 Phase12B original source connected components
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-phase12b-original-vertex-components
          path: /tmp/t21-phase12b-original-vertex-components.json
          if-no-files-found: error
          retention-days: 14

      - name: T21 Phase12C full source triangles preflight
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        shell: bash
        run: |
          python scripts/undertow-temple01-phase12c-render-preflight.py --self-test
          python scripts/undertow-temple01-phase12c-render-preflight.py /tmp/kitrix-lfs/Vss_Temple01.obj /tmp/t21-phase12b-original-vertex-components.json /tmp/t21-phase12c-original-source-triangles.json

      - name: Upload T21 Phase12C original source triangles
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-phase12c-162-original-triangles
          path: /tmp/t21-phase12c-original-source-triangles.json
          if-no-files-found: error
          retention-days: 14

      - name: T21 Phase12D full original FloorLine family symmetry search
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        shell: bash
        run: |
          python scripts/undertow-temple01-phase12d-full-family-mirror-audit.py --self-test
          python scripts/undertow-temple01-phase12d-full-family-mirror-audit.py /tmp/kitrix-lfs/Vss_Temple01.obj /tmp/t21-phase12c-original-source-triangles.json /tmp/t21-phase12d-full-family-mirror-results.json

      - name: Upload T21 Phase12D full original symmetry evidence
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-phase12d-original-all-family-mirror
          path: /tmp/t21-phase12d-full-family-mirror-results.json
          if-no-files-found: error
          retention-days: 14

      - name: T21 Phase12D recover exact original four mirrored source components
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        shell: bash
        run: |
          python scripts/undertow-temple01-phase12d-recovered-source-pairs.py --self-test
          python scripts/undertow-temple01-phase12d-recovered-source-pairs.py /tmp/kitrix-lfs/Vss_Temple01.obj /tmp/t21-phase12d-full-family-mirror-results.json /tmp/t21-phase12c-original-source-triangles.json /tmp/t21-phase12d-four-full-original-source-pairs.json

      - name: T21 Phase12F original OBJ exact edge and nearby 3D triangle audit
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        shell: bash
        run: |
          python scripts/undertow-temple01-phase12f-original-edge-contact.py --self-test
          python scripts/undertow-temple01-phase12f-original-edge-contact.py /tmp/kitrix-lfs/Vss_Temple01.obj /tmp/t21-phase12d-four-full-original-source-pairs.json /tmp/t21-phase12f-original-source-edges.json

      - name: T21 Phase12G pinned original four source edge 3D segment-triangle contacts
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        shell: bash
        run: |
          python scripts/undertow-temple01-phase12g-source-segment-triangle.py --self-test
          python scripts/undertow-temple01-phase12g-source-segment-triangle.py /tmp/kitrix-lfs/Vss_Temple01.obj /tmp/t21-phase12f-original-source-edges.json /tmp/t21-phase12g-source-segment-contacts.json

      - name: Upload T21 Phase12G exact four source contacts
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-phase12g-exact-source-contact-evidence
          path: /tmp/t21-phase12g-source-segment-contacts.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload T21 Phase12F source edge evidence
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-phase12f-16-pinned-source-edges
          path: /tmp/t21-phase12f-original-source-edges.json
          if-no-files-found: error
          retention-days: 14

      - name: T21 Phase12I pinned whole original broad-structure candidate survey
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        shell: bash
        run: |
          python scripts/undertow-temple01-phase12i-broad-structure-survey.py --self-test
          python scripts/undertow-temple01-phase12i-broad-structure-survey.py /tmp/kitrix-lfs/Vss_Temple01.obj /tmp/t21-phase12c-original-source-triangles.json /tmp/t21-phase12d-four-full-original-source-pairs.json /tmp/t21-phase12i-broad-structure-survey.json

      - name: Upload T21 Phase12I broad original structure shortlist
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-phase12i-pinned-broad-original-structures
          path: /tmp/t21-phase12i-broad-structure-survey.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload T21 Phase12D recovered original source pairs
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-phase12d-four-recovered-original-source-pairs
          path: /tmp/t21-phase12d-four-full-original-source-pairs.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload T21 whole-stage walk-source inventory
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-whole-stage-walk-source-inventory
          path: /tmp/t21-whole-stage-source-inventory.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload T21 Phase11 central original nearest 3D source audit
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-phase11-central-nearest-original-source
          path: /tmp/t21-phase11-central-nearest-source-geometry.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload T21 Phase10 exact original triangle-edge topology evidence
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-phase10-exact-edge-topology
          path: /tmp/t21-phase10-exact-obj-edge-adjacency.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload T21 Phase9 five exact underface mirror pairs
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-phase9-exact-source-underfaces
          path: /tmp/t21-phase9-exact-downface-review-source.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload T21 Phase9 original downward-facing source inventory
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-phase9-original-downward-source
          path: /tmp/t21-phase9-downward-source-inventory.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload T21 Phase8 exact central tower, flank and side edge source
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-phase8-original-support-source
          path: /tmp/t21-phase8-original-support-source.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload T21 Phase7 exact flank support and mid-glass source
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-phase7-framed-source
          path: /tmp/t21-structural-frame-phase7-source.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload T21 high structure source phase 6
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-high-structure-phase6-source
          path: /tmp/t21-high-structure-source-phase6.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload T21 exact vertical glass-metal-pillar source phase 5B
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-exact-vertical-phase5b
          path: /tmp/t21-vertical-exact-review-phase5b.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload T21 full-stage vertical source inventory
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-vertical-source-inventory
          path: /tmp/t21-vertical-source-inventory.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload T21 exact flank and elevated source phase 4
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-flank-elevation-phase4-source
          path: /tmp/t21-flank-elevation-phase4.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload T21 exact broad static floor-source batch 3
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-source-broad-terrain-batch3
          path: /tmp/t21-broad-source-batch3.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload T21 Temple01 upper-terrain source audit
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-upper-terrain-source-audit
          path: /tmp/t21-pass18c-upper-terrain.json
          if-no-files-found: error
          retention-days: 7

      - name: T21 source-native macro review export
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        shell: bash
        run: python scripts/undertow-source-native-review-export.py /tmp/t21-pass18c-upper-terrain.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Phase 0 Coverage Ledger v3 is a diagnostic, not a runtime stage promotion.
      - name: T21 Phase 0 whole-stage XZ and Pass18G candidate coverage ledger v3
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayCoverageLedgerV3Audit.test.ts

      - name: Upload T21 coverage ledger v3
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-coverage-ledger-v3
          path: /tmp/t21-coverage-ledger-v3.json
          if-no-files-found: error
          retention-days: 14

      # Complete fail-fast gate before the long frozen Pass18 diagnostic matrix.
      - name: T21 whole-stage source inventory authority QA
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_FULL_STAGE_SOURCE_JSON: /tmp/t21-whole-stage-source-inventory.json
        run: npx vitest run scripts/UndertowSpillwayWholeStageSourceInventoryQa.test.ts

      - name: T21 large static floor source-XYZ exactness QA
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_BATCH3_EXACT_SOURCE_JSON: /tmp/t21-broad-source-batch3.json
        run: npx vitest run scripts/UndertowSpillwayBroadSourceBatch3Qa.test.ts

      - name: T21 Phase4 exact flank and elevation original XYZ QA
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PHASE4_EXACT_SOURCE_JSON: /tmp/t21-flank-elevation-phase4.json
        run: npx vitest run scripts/UndertowSpillwayFlankElevationPhase4Qa.test.ts

      - name: T21 Phase5A whole-source vertical provenance QA
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_VERTICAL_SOURCE_JSON: /tmp/t21-vertical-source-inventory.json
        run: npx vitest run scripts/UndertowSpillwayVerticalSourceInventoryQa.test.ts

      - name: T21 Phase5B exact vertical source XYZ QA
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_VERTICAL_5B_EXACT_SOURCE_JSON: /tmp/t21-vertical-exact-review-phase5b.json
        run: npx vitest run scripts/UndertowSpillwayVerticalPhase5BSourceQa.test.ts

      - name: T21 Phase6 exact high structural source XYZ QA
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_HIGH_PHASE6_SOURCE_JSON: /tmp/t21-high-structure-source-phase6.json
        run: npx vitest run scripts/UndertowSpillwayHighSourcePhase6Qa.test.ts

      - name: T21 Phase7 exact original side-support and glass-frame XYZ QA
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PHASE7_SOURCE_JSON: /tmp/t21-structural-frame-phase7-source.json
        run: npx vitest run scripts/UndertowSpillwayPhase7FramedSourceQa.test.ts

      - name: T21 Phase8 exact original central and flank support source XYZ QA
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PHASE8_SOURCE_JSON: /tmp/t21-phase8-original-support-source.json
        run: npx vitest run scripts/UndertowSpillwayPhase8StaticSourceQa.test.ts

      - name: T21 Phase9 exact original downward-facing XYZ source QA
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PHASE9_EXACT_SOURCE_JSON: /tmp/t21-phase9-exact-downface-review-source.json
        run: npx vitest run scripts/UndertowSpillwayPhase9DownfaceQa.test.ts

      - name: T21 Phase10 independent pinned OBJ seam adjacency QA
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PHASE10_TOPOLOGY_JSON: /tmp/t21-phase10-exact-obj-edge-adjacency.json
        run: npx vitest run scripts/UndertowSpillwayPhase10OriginalEdgeTopologyQa.test.ts

      - name: T21 Phase11 central closest original 3D source geometry QA
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PHASE11_SOURCE_JSON: /tmp/t21-phase11-central-nearest-source-geometry.json
        run: npx vitest run scripts/UndertowSpillwayPhase11CentralNearestSurfaceQa.test.ts

      - name: T21 Phase12 pinned original central source-family 16-face binary64 QA
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PHASE11_SOURCE_JSON: /tmp/t21-phase11-central-nearest-source-geometry.json
        run: npx vitest run scripts/UndertowSpillwayPhase12SourceFamilyQa.test.ts

      - name: T21 Phase12B pinned OBJ original-vertex component integrity QA
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PHASE12B_COMPONENT_JSON: /tmp/t21-phase12b-original-vertex-components.json
        run: npx vitest run scripts/UndertowSpillwayPhase12BOriginalComponentQa.test.ts

      - name: T21 Phase12C exact registered 124 source-mesh overlap and hard-XZ gate
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PHASE12C_SOURCE_JSON: /tmp/t21-phase12c-original-source-triangles.json
          T21_PHASE12C_GATE_REPORT: /tmp/t21-phase12c-registered124-overlap-report.json
        run: npx vitest run scripts/UndertowSpillwayPhase12CRegisteredMeshOverlapQa.test.ts

      - name: Upload T21 Phase12C registered 124 overlap evidence
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-phase12c-registered124-gates
          path: /tmp/t21-phase12c-registered124-overlap-report.json
          if-no-files-found: error
          retention-days: 14

      - name: T21 Phase12C exact opt-in 70 original triangle byte audit
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PHASE12C_SOURCE_JSON: /tmp/t21-phase12c-original-source-triangles.json
          T21_PHASE12C_GATE_REPORT: /tmp/t21-phase12c-registered124-overlap-report.json
        run: npx vitest run scripts/UndertowSpillwayPhase12COptInFullSourceQa.test.ts

      - name: T21 Phase12D original mirror and frozen outside-XZ distance QA
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PHASE12C_SOURCE_JSON: /tmp/t21-phase12c-original-source-triangles.json
          T21_PHASE12D_MIRROR_JSON: /tmp/t21-phase12d-full-family-mirror-results.json
          T21_PHASE12D_HARD_XZ_REPORT: /tmp/t21-phase12d-hard-xz-violation-results.json
        run: npx vitest run scripts/UndertowSpillwayPhase12DOriginalMirrorAndHardXZQa.test.ts

      - name: Upload T21 Phase12D hard XZ source overrun evidence
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-phase12d-original-hard-xz-overrun
          path: /tmp/t21-phase12d-hard-xz-violation-results.json
          if-no-files-found: error
          retention-days: 14

      - name: T21 Phase12D recovered originals vs 124 plus 8 opt-in source meshes
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
