name: Build and deploy Ink TPS to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: T21 temporary Temple01 geometry probe
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kitrix-lfs
          mkdir -p /tmp/kitrix-lfs
          cd /tmp/kitrix-lfs
          git init -q
          git remote add origin https://github.com/kirakira-dev/KiTrix.git
          git lfs install --local
          cat > temple01.pointer <<'PTR'
          version https://git-lfs.github.com/spec/v1
          oid sha256:a32cff26b1a142d31e7658ebc48f213059b3ea42e86d32ed12cb80de5b03d046
          size 43263289
          PTR
          timeout 180s git lfs smudge < temple01.pointer > Vss_Temple01.obj
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import math

          p = Path('/tmp/kitrix-lfs/Vss_Temple01.obj')
          vertices = [None]
          faces = []
          current_object = '(none)'
          current_material = '(none)'

          def active(name):
              return (
                  name.startswith('Fld_Temple01_') or
                  name.startswith('FldObj_Temple01_PntSet_')
              )

          with p.open('r', encoding='utf-8', errors='replace') as fh:
              for line in fh:
                  if line.startswith('o '):
                      current_object = line[2:].strip()
                  elif line.startswith('usemtl '):
                      current_material = line[7:].strip()
                  elif line.startswith('v '):
                      q=line.split()
                      vertices.append(tuple(map(float,q[1:4])))
                  elif line.startswith('f ') and active(current_object):
                      ids=[]
                      for token in line.split()[1:]:
                          ids.append(int(token.split('/')[0]))
                      if len(ids)>=3:
                          for i in range(1,len(ids)-1):
                              faces.append((ids[0],ids[i],ids[i+1],current_object,current_material))

          print(f'T21RAY file_bytes={p.stat().st_size} vertices={len(vertices)-1} active_faces={len(faces)}')

          def floor_hits(x,z):
              raw=[]
              for ia,ib,ic,obj,mat in faces:
                  a=vertices[ia]; b=vertices[ib]; c=vertices[ic]
                  x1,y1,z1=a; x2,y2,z2=b; x3,y3,z3=c
                  den=(z2-z3)*(x1-x3)+(x3-x2)*(z1-z3)
                  if abs(den)<1e-9:
                      continue
                  wa=((z2-z3)*(x-x3)+(x3-x2)*(z-z3))/den
                  wb=((z3-z1)*(x-x3)+(x1-x3)*(z-z3))/den
                  wc=1.0-wa-wb
                  if min(wa,wb,wc)<-1e-5 or max(wa,wb,wc)>1.00001:
                      continue
                  ux,uy,uz=x2-x1,y2-y1,z2-z1
                  vx,vy,vz=x3-x1,y3-y1,z3-z1
                  nx=uy*vz-uz*vy
                  ny=uz*vx-ux*vz
                  nz=ux*vy-uy*vx
                  norm=math.sqrt(nx*nx+ny*ny+nz*nz)
                  if norm<1e-9 or abs(ny)/norm<0.35:
                      continue
                  y=wa*y1+wb*y2+wc*y3
                  raw.append((y,obj,mat,abs(ny)/norm))
              raw.sort(reverse=True,key=lambda r:r[0])
              out=[]
              for hit in raw:
                  if not out or abs(hit[0]-out[-1][0])>0.03:
                      out.append(hit)
              return out

          ORIGIN=(420.96,297.66)
          NEG=(131.82,155.58)
          POS=(709.98,439.5)
          dx=POS[0]-NEG[0]; dy=POS[1]-NEG[1]
          ll=math.hypot(dx,dy)
          zdir=(dx/ll,dy/ll)
          xdir=(zdir[1],-zdir[0])

          def conv(pt):
              dx=pt[0]-ORIGIN[0]; dy=pt[1]-ORIGIN[1]
              return (
                  (dx*xdir[0]+dy*xdir[1])/4.8,
                  (dx*zdir[0]+dy*zdir[1])/4.8
              )

          def centroid(points):
              pts=[conv(p) for p in points]
              return (sum(p[0] for p in pts)/len(pts),sum(p[1] for p in pts)/len(pts))

          targets={
              'CENTER_ORIGIN':(0.0,0.0),
              'NEG_SPAWN':conv(NEG),
              'POS_SPAWN':conv(POS),
              'CENTER_FACE':centroid([(406.08,308.76),(435.84,308.76),(435.84,286.44),(406.08,286.44)]),
              'NEG_CENTER_STEP':centroid([(406.08,282.84),(435.84,282.84),(435.84,286.44),(406.08,286.44)]),
              'POS_CENTER_STEP':centroid([(406.08,308.76),(435.84,308.76),(435.84,312.36),(406.08,312.36)]),
              'NEG_GRATE':centroid([(340.56,119.88),(363.48,119.88),(363.48,150.48),(340.56,150.48)]),
              'POS_GRATE':centroid([(478.44,444.72),(501.36,444.72),(501.36,475.32),(478.44,475.32)]),
              'NEG_GLASS':centroid([(382.44,230.28),(420.96,230.28),(420.96,267.84),(382.44,267.84)]),
              'POS_GLASS':centroid([(420.96,327.36),(459.48,327.36),(459.48,364.92),(420.96,364.92)]),
              'NEG_GLASS_MARKER':centroid([(382.44,244.92),(420.96,244.92),(420.96,261.24),(382.44,261.24)]),
              'POS_GLASS_MARKER':centroid([(420.96,333.96),(459.48,333.96),(459.48,350.28),(420.96,350.28)]),
          }

          for name,(x,z) in targets.items():
              hits=floor_hits(x,z)
              brief=[(round(y,3),obj,mat) for y,obj,mat,_ in hits[:8]]
              print(f'T21RAY POINT {name} x={x:.4f} z={z:.4f} hits={brief}')

          lines={
              'A_FIRST':[(620.4,423.12),(664.68,423.12),(664.68,394.2)],
              'A_RIGHT':[(664.68,394.2),(702.36,394.2),(702.36,350.76)],
              'B_FIRST':[(221.52,172.08),(177.24,172.08),(177.24,201.0)],
              'B_RIGHT':[(177.24,201.0),(139.56,201.0),(139.56,244.44)],
          }

          for lname,pdfpts in lines.items():
              pts=[conv(p) for p in pdfpts]
              for si,(a,b) in enumerate(zip(pts,pts[1:])):
                  tx=b[0]-a[0]; tz=b[1]-a[1]
                  ln=math.hypot(tx,tz)
                  nx,nz=-tz/ln,tx/ln
                  for side,sign in [('LEFT',1),('RIGHT',-1)]:
                      for off in (0.35,0.75,1.25):
                          vals=[]
                          for t in (0.25,0.5,0.75):
                              x=a[0]+tx*t+nx*off*sign
                              z=a[1]+tz*t+nz*off*sign
                              hits=floor_hits(x,z)
                              vals.append(None if not hits else round(hits[0][0],3))
                          print(f'T21RAY LINE {lname} seg={si} side={side} off={off:.2f} top={vals}')

          # Inspect the compact Turf-only central slope object directly.
          slope_name='FldObj_Temple01_PntSet_pCube21531_1__FloorSlope00'
          slope_faces=[f for f in faces if f[3]==slope_name]
          print(f'T21RAY SLOPE_OBJECT faces={len(slope_faces)}')
          rows=[]
          for ia,ib,ic,obj,mat in slope_faces:
              tri=[vertices[ia],vertices[ib],vertices[ic]]
              cx=sum(v[0] for v in tri)/3; cz=sum(v[2] for v in tri)/3
              ymin=min(v[1] for v in tri); ymax=max(v[1] for v in tri)
              xmin=min(v[0] for v in tri); xmax=max(v[0] for v in tri)
              zmin=min(v[2] for v in tri); zmax=max(v[2] for v in tri)
              rows.append((round(cx,3),round(cz,3),round(ymin,3),round(ymax,3),round(xmin,3),round(xmax,3),round(zmin,3),round(zmax,3)))
          for row in sorted(set(rows)):
              print('T21RAY SLOPE_TRI',row)

          def walkable_hit(x,z):
              hits=floor_hits(x,z)
              for y,obj,mat,up in hits:
                  if any(k in mat for k in (
                      'FloorConcrete','FloorLine','FloorSlope','FloorGrass',
                      'GrassFloor','FloorMetal','FloorRubber','BridgeMetal'
                  )):
                      return (y,obj,mat)
              return None

          # Build a spatial index for floor-height rasterization.
          walk_tokens=(
              'FloorConcrete','FloorLine','FloorSlope','FloorGrass',
              'GrassFloor','FloorMetal','FloorRubber','BridgeMetal'
          )
          walk_faces=[f for f in faces if any(k in f[4] for k in walk_tokens)]
          cell_size=2.0
          bins={}
          for fi,(ia,ib,ic,obj,mat) in enumerate(walk_faces):
              tri=[vertices[ia],vertices[ib],vertices[ic]]
              xmin=min(v[0] for v in tri); xmax=max(v[0] for v in tri)
              zmin=min(v[2] for v in tri); zmax=max(v[2] for v in tri)
              ix0=math.floor(xmin/cell_size); ix1=math.floor(xmax/cell_size)
              iz0=math.floor(zmin/cell_size); iz1=math.floor(zmax/cell_size)
              for ix in range(ix0,ix1+1):
                  for iz in range(iz0,iz1+1):
                      bins.setdefault((ix,iz),[]).append(fi)

          def fast_top(x,z):
              candidates=bins.get((math.floor(x/cell_size),math.floor(z/cell_size)),())
              best=None
              for fi in candidates:
                  ia,ib,ic,obj,mat=walk_faces[fi]
                  a=vertices[ia]; b=vertices[ib]; cc=vertices[ic]
                  x1,y1,z1=a; x2,y2,z2=b; x3,y3,z3=cc
                  den=(z2-z3)*(x1-x3)+(x3-x2)*(z1-z3)
                  if abs(den)<1e-9:
                      continue
                  wa=((z2-z3)*(x-x3)+(x3-x2)*(z-z3))/den
                  wb=((z3-z1)*(x-x3)+(x1-x3)*(z-z3))/den
                  wc=1-wa-wb
                  if min(wa,wb,wc)<-1e-6:
                      continue
                  ux,uy,uz=x2-x1,y2-y1,z2-z1
                  vx,vy,vz=x3-x1,y3-y1,z3-z1
                  nx=uy*vz-uz*vy; ny=uz*vx-ux*vz; nz=ux*vy-uy*vx
                  norm=math.sqrt(nx*nx+ny*ny+nz*nz)
                  if norm<1e-9 or abs(ny)/norm<0.35:
                      continue
                  y=wa*y1+wb*y2+wc*y3
                  if best is None or y>best:
                      best=y
              return best

          # Rasterize model walkable top surfaces and extract connected
          # discontinuity contours. These are used only to register the PDF
          # plan to the remodel mesh; no Y is promoted from this temporary step.
          step=0.5
          xs=[-42.0+i*step for i in range(int(84/step)+1)]
          zs=[-70.0+i*step for i in range(int(140/step)+1)]
          grid={}
          for ix,x in enumerate(xs):
              for iz,z in enumerate(zs):
                  grid[(ix,iz)]=fast_top(x,z)

          edges=[]
          for ix,x in enumerate(xs):
              for iz,z in enumerate(zs):
                  h=grid[(ix,iz)]
                  if h is None:
                      continue
                  for dix,diz in ((1,0),(0,1)):
                      j=(ix+dix,iz+diz)
                      if j not in grid or grid[j] is None:
                          continue
                      h2=grid[j]
                      if abs(h2-h)>=1.0:
                          ex=x+dix*step*0.5
                          ez=z+diz*step*0.5
                          pair=tuple(sorted((round(h*2)/2,round(h2*2)/2)))
                          edges.append((round(ex,3),round(ez,3),pair))

          edge_at={}
          for x,z,pair in edges:
              edge_at.setdefault((x,z),Counter())[pair]+=1

          # Connectivity in metric space, allowing adjacent half-meter edge samples.
          points=set(edge_at)
          comps=[]
          while points:
              seed=points.pop()
              q=[seed]; comp=[seed]
              while q:
                  px,pz=q.pop()
                  near=[]
                  for dx in (-0.5,-0.25,0,0.25,0.5):
                      for dz in (-0.5,-0.25,0,0.25,0.5):
                          if dx==0 and dz==0:
                              continue
                          np=(round(px+dx,3),round(pz+dz,3))
                          if np in points:
                              points.remove(np); q.append(np); comp.append(np)
              comps.append(comp)

          comps.sort(key=len,reverse=True)
          print(f'T21EDGE total={len(edges)} components={len(comps)}')
          for ci,comp in enumerate(comps[:30]):
              if len(comp)<4:
                  continue
              xvals=[p[0] for p in comp]; zvals=[p[1] for p in comp]
              pairs=Counter()
              for p in comp:
                  pairs.update(edge_at[p])
              print(
                  f'T21EDGE COMP {ci} n={len(comp)} '
                  f'bbox=({min(xvals):.2f},{min(zvals):.2f})..({max(xvals):.2f},{max(zvals):.2f}) '
                  f'pairs={pairs.most_common(5)}'
              )

          # Extract candidate outer StageSide upper-edge vertices.
          for target in (
              'Fld_Temple01_mesh01_low146_1__StageSide00',
              'FldObj_Temple01_PntSet_mesh01_low153_1__StageSide00'
          ):
              pts=set()
              for ia,ib,ic,obj,mat in faces:
                  if obj != target:
                      continue
                  for vi in (ia,ib,ic):
                      x,y,z=vertices[vi]
                      if y >= 5.95:
                          pts.add((round(x,4),round(y,4),round(z,4)))
              print(f'T21OUTER {target} count={len(pts)}')
              for pnt in sorted(pts,key=lambda p:(p[2],p[0],p[1])):
                  print('T21OUTER V',target,pnt)

          # Compact positive-Z height map, one sample every 2m.
          print('T21EDGE POSZ_ROWS')
          for z in range(70,39,-2):
              row=[]
              for x in range(-30,31,2):
                  h=fast_top(float(x),float(z))
                  row.append(' .' if h is None else f'{int(round(h)):2d}')
              print(f'T21EDGE Z={z:2d} ' + ' '.join(row))
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build for GitHub Pages
        run: npm run build -- --base=/browser-ink-tps/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
