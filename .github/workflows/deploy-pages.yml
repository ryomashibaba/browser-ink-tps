          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18ACBranchReachabilityQa.test.ts

      - name: T21 Pass 18AD floor-slope KCC diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18ADFloorSlopeKccQa.test.ts

      - name: T21 Pass 18AE floor-slope Recast diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18AEFloorSlopeRecastQa.test.ts

      - name: T21 Pass 18AF floor-slope fine-radius diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18AFFloorSlopeFineRadiusQa.test.ts

      - name: T21 Pass 18AG bridge-floor endpoint isolation
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
