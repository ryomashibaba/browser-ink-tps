name: Build and deploy Ink TPS to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore T21 Temple01 LFS cache
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/cache@v4
        with:
          path: /tmp/kitrix-lfs-cache/Vss_Temple01.obj
          key: t21-temple01-lfs-a32cff26b1a142d31e7658ebc48f213059b3ea42e86d32ed12cb80de5b03d046

      - name: Prepare verified T21 Temple01 geometry source
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kitrix-lfs
          mkdir -p /tmp/kitrix-lfs
          if [ -f /tmp/kitrix-lfs-cache/Vss_Temple01.obj ]; then
            cp /tmp/kitrix-lfs-cache/Vss_Temple01.obj /tmp/kitrix-lfs/Vss_Temple01.obj
            echo "T21RAY cache=HIT"
          else
            mkdir -p /tmp/kitrix-lfs-cache
            cd /tmp/kitrix-lfs
            git init -q
            git remote add origin https://github.com/kirakira-dev/KiTrix.git
            git lfs install --local
            cat > temple01.pointer <<'PTR'
          version https://git-lfs.github.com/spec/v1
          oid sha256:a32cff26b1a142d31e7658ebc48f213059b3ea42e86d32ed12cb80de5b03d046
          size 43263289
          PTR
            timeout 180s git lfs smudge < temple01.pointer > Vss_Temple01.obj
            cp Vss_Temple01.obj /tmp/kitrix-lfs-cache/Vss_Temple01.obj
            echo "T21RAY cache=MISS"
          fi
          test "$(stat -c%s /tmp/kitrix-lfs/Vss_Temple01.obj)" = "43263289"
          echo "a32cff26b1a142d31e7658ebc48f213059b3ea42e86d32ed12cb80de5b03d046  /tmp/kitrix-lfs/Vss_Temple01.obj" | sha256sum -c -
          echo "T21SOURCE verified_bytes=43263289 sha256=a32cff26b1a142d31e7658ebc48f213059b3ea42e86d32ed12cb80de5b03d046"

      - name: T21 Temple01 Pass 18C upper-terrain source audit
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        shell: bash
        run: python scripts/undertow-temple01-upper-terrain-audit.py /tmp/kitrix-lfs/Vss_Temple01.obj

      - name: Upload T21 whole-stage walk-source inventory
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-whole-stage-walk-source-inventory
          path: /tmp/t21-whole-stage-source-inventory.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload T21 Phase8 exact central tower, flank and side edge source
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-phase8-original-support-source
          path: /tmp/t21-phase8-original-support-source.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload T21 Phase7 exact flank support and mid-glass source
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-phase7-framed-source
          path: /tmp/t21-structural-frame-phase7-source.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload T21 high structure source phase 6
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-high-structure-phase6-source
          path: /tmp/t21-high-structure-source-phase6.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload T21 exact vertical glass-metal-pillar source phase 5B
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-exact-vertical-phase5b
          path: /tmp/t21-vertical-exact-review-phase5b.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload T21 full-stage vertical source inventory
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-vertical-source-inventory
          path: /tmp/t21-vertical-source-inventory.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload T21 exact flank and elevated source phase 4
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-flank-elevation-phase4-source
          path: /tmp/t21-flank-elevation-phase4.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload T21 exact broad static floor-source batch 3
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-source-broad-terrain-batch3
          path: /tmp/t21-broad-source-batch3.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload T21 Temple01 upper-terrain source audit
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-upper-terrain-source-audit
          path: /tmp/t21-pass18c-upper-terrain.json
          if-no-files-found: error
          retention-days: 7

      - name: T21 source-native macro review export
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        shell: bash
        run: python scripts/undertow-source-native-review-export.py /tmp/t21-pass18c-upper-terrain.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Phase 0 Coverage Ledger v3 is a diagnostic, not a runtime stage promotion.
      - name: T21 Phase 0 whole-stage XZ and Pass18G candidate coverage ledger v3
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayCoverageLedgerV3Audit.test.ts

      - name: Upload T21 coverage ledger v3
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-coverage-ledger-v3
          path: /tmp/t21-coverage-ledger-v3.json
          if-no-files-found: error
          retention-days: 14

      # Complete fail-fast gate before the long frozen Pass18 diagnostic matrix.
      - name: T21 whole-stage source inventory authority QA
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_FULL_STAGE_SOURCE_JSON: /tmp/t21-whole-stage-source-inventory.json
        run: npx vitest run scripts/UndertowSpillwayWholeStageSourceInventoryQa.test.ts

      - name: T21 large static floor source-XYZ exactness QA
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_BATCH3_EXACT_SOURCE_JSON: /tmp/t21-broad-source-batch3.json
        run: npx vitest run scripts/UndertowSpillwayBroadSourceBatch3Qa.test.ts

      - name: T21 Phase4 exact flank and elevation original XYZ QA
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PHASE4_EXACT_SOURCE_JSON: /tmp/t21-flank-elevation-phase4.json
        run: npx vitest run scripts/UndertowSpillwayFlankElevationPhase4Qa.test.ts

      - name: T21 Phase5A whole-source vertical provenance QA
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_VERTICAL_SOURCE_JSON: /tmp/t21-vertical-source-inventory.json
        run: npx vitest run scripts/UndertowSpillwayVerticalSourceInventoryQa.test.ts

      - name: T21 Phase5B exact vertical source XYZ QA
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_VERTICAL_5B_EXACT_SOURCE_JSON: /tmp/t21-vertical-exact-review-phase5b.json
        run: npx vitest run scripts/UndertowSpillwayVerticalPhase5BSourceQa.test.ts

      - name: T21 Phase6 exact high structural source XYZ QA
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_HIGH_PHASE6_SOURCE_JSON: /tmp/t21-high-structure-source-phase6.json
        run: npx vitest run scripts/UndertowSpillwayHighSourcePhase6Qa.test.ts

      - name: T21 Phase7 exact original side-support and glass-frame XYZ QA
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PHASE7_SOURCE_JSON: /tmp/t21-structural-frame-phase7-source.json
        run: npx vitest run scripts/UndertowSpillwayPhase7FramedSourceQa.test.ts

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: T21 Pass 18BW top-cap rasterization isolation diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18BWTopCapRasterizationIsolationQa.test.ts

      - name: T21 Pass 18BX axis-isolated bounds/grid diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18BXAxisIsolatedBoundsGridQa.test.ts

      - name: T21 Pass 18BY active-min grid phase/extent diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18BYActiveMinGridPhaseExtentQa.test.ts

      - name: T21 Pass 18BZ fixed-cell active-min phase sweep diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18BZActiveMinPhaseSweepQa.test.ts

      - name: T21 Pass 18CA active-min phase transition refinement diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18CAActiveMinPhaseTransitionRefinementQa.test.ts

      - name: T21 Temple01 local XZ contour audit
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        shell: bash
        run: python scripts/undertow-temple01-xz-audit.py /tmp/kitrix-lfs/Vss_Temple01.obj

      - name: T21 Temple01 water Y candidate audit
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        shell: bash
        run: python scripts/undertow-temple01-water-y-audit.py /tmp/kitrix-lfs/Vss_Temple01.obj


      - name: T21 Sunfish Zones vector recovery audit
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet "PyMuPDF==1.26.4"
          python scripts/undertow-sunfish-zones-pdf-audit.py \
            --output /tmp/undertow-zones-vector-audit.json \
            --pdf-output /tmp/undertow-zones-sunfish.pdf

      - name: Upload T21 Sunfish Zones vector audit
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-zones-vector-audit
          path: |
            /tmp/undertow-zones-vector-audit.json
            /tmp/undertow-zones-sunfish.pdf
          if-no-files-found: ignore
          retention-days: 7

      - name: T21 Sunfish Turf route-ramp vector audit
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/undertow-sunfish-turf-ramp-paint-audit.py \
            --output /tmp/undertow-turf-ramp-paint-audit.json \
            --pdf-output /tmp/undertow-turf-sunfish.pdf

      - name: Upload T21 Sunfish Turf ramp audit
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-turf-ramp-paint-audit
          path: |
            /tmp/undertow-turf-ramp-paint-audit.json
            /tmp/undertow-turf-sunfish.pdf
          if-no-files-found: ignore
          retention-days: 7

      - name: T21 Pass 18BU shared bridge internal isolation diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18BUSharedBridgeInternalIsolationQa.test.ts

      - name: T21 Pass 18BV shared top-cap relation diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18BVSharedTopCapRelationQa.test.ts

      - name: T21 Pass 18AN slope-floor00 radius diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18ANSlopeFloor00RadiusQa.test.ts

      - name: T21 Pass 18AO post-floor00 break diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18AOPostFloor00BreakQa.test.ts

      - name: T21 Pass 18AP floor00-lower-floor02 production KCC diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18APFloor00LowerFloor02KccQa.test.ts

      - name: T21 Pass 18AQ QA-only directional attachment diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18AQDirectionalAttachmentQa.test.ts

      - name: T21 Pass 18AR directional fine-radius diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18ARDirectionalFineRadiusQa.test.ts

      - name: T21 Pass 18AS directional terminal-radius diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18ASDirectionalTerminalRadiusQa.test.ts

      - name: T21 Pass 18AT directional 1mm-radius diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18ATDirectionalOneMmRadiusQa.test.ts

      - name: T21 Pass 18AU directional 0.1mm-radius diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18AUDirectionalPointOneMmRadiusQa.test.ts

      - name: T21 Pass 18AV lower-floor02 continuation diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18AVLowerFloor02ContinuationQa.test.ts

      - name: T21 Pass 18AW low-slope production KCC diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18AWLowSlopeKccQa.test.ts

      - name: T21 Pass 18AX low-slope minimality/radius diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18AXLowSlopeMinimalityRadiusQa.test.ts

      - name: T21 Pass 18AY low-slope continuation diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18AYLowSlopeContinuationQa.test.ts

      - name: T21 Pass 18AZ post-low-slope branch KCC diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18AZPostLowSlopeBranchKccQa.test.ts

      - name: T21 Pass 18BA post-low-slope directional attachment diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18BAPostLowSlopeDirectionalAttachmentQa.test.ts

      - name: T21 Pass 18BB HIGH local endpoint isolation diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18BBHighLocalEndpointIsolationQa.test.ts

      - name: T21 Pass 18BC HIGH exact-raw narrow-radius diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18BCHighExactRawNarrowRadiusQa.test.ts

      - name: T21 Pass 18BD HIGH off-mesh search-extent diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18BDHighOffMeshSearchExtentQa.test.ts

      - name: T21 Pass 18BE HIGH nav-island identity diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18BEHighNavIslandIdentityQa.test.ts

      - name: T21 Pass 18BF direct representative validity diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18BFDirectRepresentativeValidityQa.test.ts

      - name: T21 Pass 18BG direct-valid frontier diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18BGDirectValidFrontierQa.test.ts

      - name: T21 Pass 18BH HIGH target rasterization diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18BHHighTargetRasterizationQa.test.ts

      - name: T21 Pass 18BI HIGH target Recast parameter isolation
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18BIHighTargetRecastParameterIsolationQa.test.ts

      - name: T21 Pass 18BJ HIGH target constant-erosion resolution diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
