        run: npx vitest run scripts/UndertowSpillwayPass18AHFloorEndpointLocalSearchQa.test.ts

      - name: T21 Pass 18AI floor endpoint interpolation
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
