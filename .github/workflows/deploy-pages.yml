        run: npx vitest run scripts/UndertowSpillwayPass18AIFloorEndpointInterpolationQa.test.ts

      - name: T21 Pass 18AJ floor endpoint fine-retreat
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
