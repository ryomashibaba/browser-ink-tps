        run: npx vitest run scripts/UndertowSpillwayPass18AMSlopeFloor00KccQa.test.ts

      - name: Build for GitHub Pages
        run: npm run build -- --base=/browser-ink-tps/

      # Fast 5-view evidence capture runs in a separate PARALLEL PR job.
      # Keep the long frozen Pass18 regression independent of headless Chrome.

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

 
  t21-visual-evidence:
    name: T21 fast five-view WebGPU evidence
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout exact T21 PR revision
        uses: actions/checkout@v6

      - name: Setup Node.js for visual review
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pinned browser InkTPS build dependencies
        run: npm install --no-audit --no-fund

      - name: Build real source-grounded review app
        run: npm run build -- --base=/browser-ink-tps/

      - name: T21 bounded five-view headless WebGPU capture
        id: five_view
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/t21-review-five-view-capture.mjs

      - name: T21 Phase12M assert all 3 optional original-only browser screenshots were captured
        if: always()
        run: node scripts/t21-review-phase12m-capture-gate.mjs

      - name: T21 Phase12N validate four real locked-camera mirror A/B screenshots
        if: always()
        run: |
          node scripts/t21-review-phase12n-mirror-gate.mjs --self-test
          node scripts/t21-review-phase12n-mirror-gate.mjs

      - name: T21 Phase12O verify real locked-camera zoom increases original detail visibility
        if: always()
        run: |
          node scripts/t21-review-phase12o-zoom-gate.mjs --self-test
          node scripts/t21-review-phase12o-zoom-gate.mjs

      - name: T21 Phase13B same-camera UI-free screenshot pair QA
        if: always()
        run: |
          node scripts/t21-phase13b-ui-free-pair-qa.mjs --self-test
          node scripts/t21-phase13b-ui-free-pair-qa.mjs --audit /tmp/t21-review-five-view /tmp/t21-review-five-view/T21_PHASE13B_UI_FREE_EVIDENCE.json

      - name: Upload T21 Phase13B real UI-free pair PNGs and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-phase13b-matched-camera-ui-free
          path: |
            /tmp/t21-review-five-view/T21_PHASE13B_UI_FREE_EVIDENCE.json
            /tmp/t21-review-five-view/T21_PHASE13B_OVERVIEW_UI_FREE_WEBGL2.png
            /tmp/t21-review-five-view/T21_PHASE13B_TOP_UI_FREE_WEBGL2.png
          if-no-files-found: error
          retention-days: 14

      - name: T21 Phase13C two true focused camera PNG and safety QA
        if: always()
        run: |
          node scripts/t21-phase13c-camera-qa.mjs --self-test
          node scripts/t21-phase13c-camera-qa.mjs --audit /tmp/t21-review-five-view /tmp/t21-review-five-view/T21_PHASE13C_FOCUSED_CAMERA_EVIDENCE.json

      - name: Upload T21 Phase13C original source-only focused camera evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-phase13c-original-focused-camera-pairs
          path: |
            /tmp/t21-review-five-view/T21_PHASE13C_FOCUSED_CAMERA_EVIDENCE.json
            /tmp/t21-review-five-view/T21_PHASE13C_OVERVIEW_CENTER_FOCUS_WEBGL2.png
            /tmp/t21-review-five-view/T21_PHASE13C_TOP_CENTER_FOCUS_WEBGL2.png
          if-no-files-found: error
          retention-days: 14

      - name: T21 Phase13D source-only actual original lens images and negative QA
        if: always()
        run: |
          node scripts/t21-phase13d-source-lens-qa.mjs --self-test
          node scripts/t21-phase13d-source-lens-qa.mjs --audit /tmp/t21-review-five-view /tmp/t21-review-five-view/T21_PHASE13D_SOURCE_LENS_EVIDENCE.json

      - name: Upload T21 Phase13D original lens actual browser comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-phase13d-original-source-lens-a-b
          path: |
            /tmp/t21-review-five-view/T21_PHASE13D_SOURCE_LENS_EVIDENCE.json
            /tmp/t21-review-five-view/T21_PHASE13D_WALK_ORIENTED_CENTER_FOCUS_OVERVIEW_WEBGL2.png
            /tmp/t21-review-five-view/T21_PHASE13D_VERTICAL_HIGH_CENTER_FOCUS_OVERVIEW_WEBGL2.png
          if-no-files-found: error
          retention-days: 14

      - name: T21 Phase13A screenshot source visual baseline and negative QA
        if: always()
        run: |
          node scripts/t21-phase13a-real-five-view-visual-baseline.mjs --self-test
          node scripts/t21-phase13a-real-five-view-visual-baseline.mjs --audit /tmp/t21-review-five-view /tmp/t21-review-five-view/T21_PHASE13A_VISUAL_BASELINE.json

      - name: Upload T21 Phase13A screenshot baseline diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-phase13a-real-five-view-visual-baseline
          path: /tmp/t21-review-five-view/T21_PHASE13A_VISUAL_BASELINE.json
          if-no-files-found: warn
          retention-days: 14

      - name: Always upload five-view captures or explicit BLOCKED manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-real-five-view-capture
          path: /tmp/t21-review-five-view
          if-no-files-found: warn
          retention-days: 14

