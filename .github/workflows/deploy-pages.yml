        run: npx vitest run scripts/UndertowSpillwayPass18AGBridgeFloorEndpointIsolationQa.test.ts

      - name: T21 Pass 18AH floor endpoint local search
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
