name: Build and deploy Ink TPS to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore T21 Temple01 LFS cache
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/cache@v4
        with:
          path: /tmp/kitrix-lfs-cache/Vss_Temple01.obj
          key: t21-temple01-lfs-a32cff26b1a142d31e7658ebc48f213059b3ea42e86d32ed12cb80de5b03d046

      - name: Prepare verified T21 Temple01 geometry source
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kitrix-lfs
          mkdir -p /tmp/kitrix-lfs
          if [ -f /tmp/kitrix-lfs-cache/Vss_Temple01.obj ]; then
            cp /tmp/kitrix-lfs-cache/Vss_Temple01.obj /tmp/kitrix-lfs/Vss_Temple01.obj
            echo "T21RAY cache=HIT"
          else
            mkdir -p /tmp/kitrix-lfs-cache
            cd /tmp/kitrix-lfs
            git init -q
            git remote add origin https://github.com/kirakira-dev/KiTrix.git
            git lfs install --local
            cat > temple01.pointer <<'PTR'
          version https://git-lfs.github.com/spec/v1
          oid sha256:a32cff26b1a142d31e7658ebc48f213059b3ea42e86d32ed12cb80de5b03d046
          size 43263289
          PTR
            timeout 180s git lfs smudge < temple01.pointer > Vss_Temple01.obj
            cp Vss_Temple01.obj /tmp/kitrix-lfs-cache/Vss_Temple01.obj
            echo "T21RAY cache=MISS"
          fi
          test "$(stat -c%s /tmp/kitrix-lfs/Vss_Temple01.obj)" = "43263289"
          echo "a32cff26b1a142d31e7658ebc48f213059b3ea42e86d32ed12cb80de5b03d046  /tmp/kitrix-lfs/Vss_Temple01.obj" | sha256sum -c -
          echo "T21SOURCE verified_bytes=43263289 sha256=a32cff26b1a142d31e7658ebc48f213059b3ea42e86d32ed12cb80de5b03d046"

      - name: T21 Temple01 Pass 18C upper-terrain source audit
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        shell: bash
        run: python scripts/undertow-temple01-upper-terrain-audit.py /tmp/kitrix-lfs/Vss_Temple01.obj

      - name: T21 Temple01 local XZ contour audit
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        shell: bash
        run: python scripts/undertow-temple01-xz-audit.py /tmp/kitrix-lfs/Vss_Temple01.obj

      - name: T21 Temple01 water Y candidate audit
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        shell: bash
        run: python scripts/undertow-temple01-water-y-audit.py /tmp/kitrix-lfs/Vss_Temple01.obj


      - name: T21 Sunfish Zones vector recovery audit
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet "PyMuPDF==1.26.4"
          python scripts/undertow-sunfish-zones-pdf-audit.py \
            --output /tmp/undertow-zones-vector-audit.json \
            --pdf-output /tmp/undertow-zones-sunfish.pdf

      - name: Upload T21 Sunfish Zones vector audit
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-zones-vector-audit
          path: |
            /tmp/undertow-zones-vector-audit.json
            /tmp/undertow-zones-sunfish.pdf
          if-no-files-found: ignore
          retention-days: 7

      - name: T21 Sunfish Turf route-ramp vector audit
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/undertow-sunfish-turf-ramp-paint-audit.py \
            --output /tmp/undertow-turf-ramp-paint-audit.json \
            --pdf-output /tmp/undertow-turf-sunfish.pdf

      - name: Upload T21 Sunfish Turf ramp audit
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        uses: actions/upload-artifact@v4
        with:
          name: t21-undertow-turf-ramp-paint-audit
          path: |
            /tmp/undertow-turf-ramp-paint-audit.json
            /tmp/undertow-turf-sunfish.pdf
          if-no-files-found: ignore
          retention-days: 7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: T21 Pass 18C source-native Recast QA
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18CSourceRecastQa.test.ts

      - name: T21 Pass 18D production KCC traversal QA
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18DTraversalQa.test.ts

      - name: T21 Pass 18E Recast representation sweep
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18ENavigationRepresentationQa.test.ts

      - name: T21 Pass 18F QA-only local connector diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18FLocalConnectorQa.test.ts

      - name: T21 Pass 18G source-native destination chain diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18GSourceChainQa.test.ts

      - name: T21 Pass 18H local gap source-class audit
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18HGapSourceAudit.test.ts

      - name: T21 Pass 18I exact source-gap vector audit
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18IExactGapVectorQa.test.ts

      - name: T21 Pass 18J production KCC exact-gap diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18JKccGapQa.test.ts

      - name: T21 Pass 18K QA-only grate-chain connector diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18KGrateChainConnectorQa.test.ts

      - name: T21 Pass 18L trusted-endpoint grate-chain diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18LTrustedGrateChainConnectorQa.test.ts

      - name: T21 Pass 18M trusted grate-chain minimality diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18MGrateChainMinimalityQa.test.ts

      - name: T21 Pass 18N raw-boundary radius sweep
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18NRawBoundaryRadiusSweepQa.test.ts

      - name: T21 Pass 18O raw/trusted grate endpoint hybrid diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/t21-undertow-evidence-ledger'
        env:
          T21_PASS18C_SOURCE_JSON: /tmp/t21-pass18c-upper-terrain.json
        run: npx vitest run scripts/UndertowSpillwayPass18OGrateEndpointHybridQa.test.ts

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build for GitHub Pages
        run: npm run build -- --base=/browser-ink-tps/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
